async function callAllyra(sys, history, newMsg, executeTool) {
  let messages = [
    ...history.slice(-24).map(m => ({ role: m.role==="user"?"user":"assistant", content: m.text })),
    { role:"user", content:newMsg }
  ];
  for (let i=0; i<4; i++) {
    const res = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ system: sys, messages, tools: ALLYRA_TOOLS }),
    });
    let d;
    try { d = await res.json(); } catch(parseErr) {
      throw new Error(`Μη έγκυρη απάντηση από τον server (HTTP ${res.status}).`);
    }
    if (!res.ok || d.error || d.type==="error") {
      const apiMsg = d.error?.message || d.error || `HTTP ${res.status}`;
      throw new Error(`Σφάλμα API: ${apiMsg}`);
    }
    const content = d.content || [];
    const toolUses = content.filter(b=>b.type==="tool_use");
    if (toolUses.length===0) {
      const textBlock = content.find(b=>b.type==="text");
      return textBlock ? textBlock.text : "Η γραμματέα απάντησε χωρίς κείμενο (πιθανό πρόβλημα μορφοποίησης) — δοκίμασε ξανά.";
    }
    messages.push({ role:"assistant", content });
    const toolResults = toolUses.map(tu => {
      let result;
      try { result = executeTool(tu.name, tu.input||{}); }
      catch(toolErr) { result = { error: `Σφάλμα εργαλείου ${tu.name}: ${toolErr.message}` }; }
      return { type:"tool_result", tool_use_id: tu.id, content: JSON.stringify(result) };
    });
    messages.push({ role:"user", content: toolResults });
  }
  return "Δεν μπόρεσα να ολοκληρώσω την αναζήτηση, δοκίμασε ξανά με πιο συγκεκριμένη ερώτηση.";
}

const WEEKDAYS_EL = {
  "κυριακη":0,"κυριακή":0,
  "δευτερα":1,"δευτέρα":1,
  "τριτη":2,"τρίτη":2,
  "τεταρτη":3,"τετάρτη":3,

};

function detectBackdate(text, refDate) {
  const t = text.toLowerCase();
  const today = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

  if (/προχθ[εέ]ς|προχτ[εέ]ς/.test(t)) {
    return fmt(new Date(today.getTime()-2*86400000));
  }
  if (/χθ[εέ]ς|χτ[εέ]ς/.test(t)) {
    return fmt(new Date(today.getTime()-86400000));
  }
  const priorDays = t.match(/πριν\s+(\d+)\s*μ[εέ]ρ/);
  if (priorDays) {
    const n = parseInt(priorDays[1],10);
    return fmt(new Date(today.getTime()-n*86400000));
  }
  const dm = t.match(/(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?/);
  if (dm) {
    let d=parseInt(dm[1],10), m=parseInt(dm[2],10), y=dm[3]?parseInt(dm[3],10):today.getFullYear();
    if (y<100) y+=2000;
    const dt = new Date(y, m-1, d);
    if (!isNaN(dt.getTime()) && dt.getTime() <= today.getTime()) return fmt(dt);
  }
  for (const [name, idx] of Object.entries(WEEKDAYS_EL)) {
    if (t.includes(name)) {
      let diff = (today.getDay() - idx + 7) % 7;
      if (diff === 0) diff = 7;
      return fmt(new Date(today.getTime() - diff*86400000));
    }
  }
  return null;
}

function renderChatText(text) {
  const lines = (text||"").split("\n");
  return lines.map((line, li) => {
    const segments = line.split(/(\*\*[^*]+\*\*)/g).filter(s => s !== "");
    return (
      <div key={li} style={{minHeight: line===""?8:undefined}}>
        {segments.map((seg, si) => {
          if (seg.startsWith("**") && seg.endsWith("**") && seg.length>4) {
            return <strong key={si}>{seg.slice(2,-2)}</strong>;
          }
          return <span key={si}>{seg}</span>;
        })}
      </div>
    );
  });
}

function orthodoxEasterDate(year) {
  const a = year % 4, b = year % 7, c = year % 19;
  const d = (19*c + 15) % 30;
  const e = (2*a + 4*b - d + 34) % 7;
  const month = Math.floor((d + e + 114) / 31);
  const day = ((d + e + 114) % 31) + 1;
  const julian = new Date(Date.UTC(year, month-1, day));
  julian.setUTCDate(julian.getUTCDate() + 13);
  return julian;
}

function isGreekHoliday(dateStr) {
  const d = new Date(dateStr + "T00:00:00Z");
  const year = d.getUTCFullYear();
  const md = `${d.getUTCMonth()+1}-${d.getUTCDate()}`;
  const fixed = ["1-1","1-6","3-25","5-1","8-15","10-28","12-25","12-26"];
  if (fixed.includes(md)) return true;
  const easter = orthodoxEasterDate(year);
  const dayMs = 86400000;
  const offsets = [-48, 0, 1, 50];
  for (const off of offsets) {
    const hd = new Date(easter.getTime() + off*dayMs);
    if (hd.getUTCFullYear()===d.getUTCFullYear() && hd.getUTCMonth()===d.getUTCMonth() && hd.getUTCDate()===d.getUTCDate()) return true;
  }
  return false;
}

function timeToMinutes(t) {
  const m = (t||"").match(/(\d{1,2}):(\d{2})/);
  if (!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}

function computeShiftBreakdown(dateStr, startTime, endTime) {
  const startMin = timeToMinutes(startTime);
  const endMinRaw = timeToMinutes(endTime);
  if (startMin===null || endMinRaw===null) return null;
  let endMin = endMinRaw;
  if (endMin <= startMin) endMin += 24*60;
  const totalMin = endMin - startMin;
  const NIGHT_START = 22*60;
  let regularMin = 0, nightMin = 0;
  for (let m = startMin; m < endMin; m += 1) {
    const wrapped = m % (24*60);
    if (wrapped >= NIGHT_START) nightMin++; else regularMin++;
  }
  const dow = new Date(dateStr+"T00:00:00Z").getUTCDay();
  const isSpecial = dow===0 || isGreekHoliday(dateStr);
  const hours = n => Math.round((n/60)*100)/100;
  if (isSpecial) {
    return { normal:0, night:0, sunday:hours(regularMin), sundayNight:hours(nightMin), total:hours(totalMin) };
  }
  return { normal:hours(regularMin), night:hours(nightMin), sunday:0, sundayNight:0, total:hours(totalMin) };
}

function detectHoursFromText(text) {
  const t = text.toLowerCase();
  const rangeMatch = t.match(/(\d{1,2}):(\d{2})\s*(?:-|έως|ως|μέχρι)\s*(\d{1,2}):(\d{2})/);
  if (rangeMatch) {
    const h1=parseInt(rangeMatch[1],10), m1=parseInt(rangeMatch[2],10);
    const h2=parseInt(rangeMatch[3],10), m2=parseInt(rangeMatch[4],10);
    let mins = (h2*60+m2) - (h1*60+m1);
    if (mins < 0) mins += 24*60;
    return Math.round((mins/60)*100)/100;
  }
  const hoursMatch = t.match(/(\d+(?:[.,]\d+)?)\s*ώρ/);
  if (hoursMatch) {
    return parseFloat(hoursMatch[1].replace(",", "."));
  }
  return null;
}

      const drv = input.driverName ? matchDriver(input.driverName) : null;
      const results = dailyHours.filter(h => {
        if (drv && h.driverId !== drv.id) return false;
        if (input.dateFrom && h.date < input.dateFrom) return false;
        if (input.dateTo && h.date > input.dateTo) return false;
        if (input.projectName) {
          const pr = h.projectId ? PROJECTS.find(p=>p.id===h.projectId) : null;
          if (!pr || !pr.name.toLowerCase().includes(input.projectName.toLowerCase())) return false;
        }
        return true;
      }).map(h => {
        const dr = drivers.find(d=>d.id===h.driverId);
        const pr = h.projectId ? PROJECTS.find(p=>p.id===h.projectId) : null;
        return { driver: dr?dr.name:("id:"+h.driverId), date:h.date, hours:h.hours, start_time:h.start_time||null, end_time:h.end_time||null, project: pr?pr.name:null };
      });
      return { count: results.length, entries: results.slice(0,150) };
    }
    if (name === "search_log") {
      const drv = input.driverName ? matchDriver(input.driverName) : null;
      const results = log.filter(l => {
        if (drv && l.driverId !== drv.id) return false;
        if (input.type && l.type !== input.type) return false;
        if (input.keyword && !(l.text||"").toLowerCase().includes(input.keyword.toLowerCase())) return false;
        if (input.dateFrom || input.dateTo) {
          const d = parseLogDate(l.ts);
          if (!d) return false;
          const dateStr = `${d.year}-${String(d.month).padStart(2,"0")}-${String(d.day).padStart(2,"0")}`;
          if (input.dateFrom && dateStr < input.dateFrom) return false;
          if (input.dateTo && dateStr > input.dateTo) return false;
        }
        return true;
      }).map(l => ({ date: l.ts, type: l.type, text: l.text }));
      return { count: results.length, entries: results.slice(0,150) };
    }
    return { error: "unknown tool: " + name };
  }, [drivers, dailyHours, log]);

  const sendMsg = useCallback(async (txt, currentMsgs, imageAttachment=null) => {
    if (!txt.trim() && !imageAttachment) return;
    const displayText = txt.trim() || "📷 Φωτογραφία προγράμματος/ωρών";
    const updated = [...currentMsgs, {role:"user", text:displayText}];
    setMessages(updated);
    setInput(""); setThinking(true);
    setAttachedImage(null);
    try {
      const msgContent = imageAttachment
        ? [
            { type:"image", source:{ type:"base64", media_type:imageAttachment.mediaType, data:imageAttachment.data } },
            { type:"text", text: txt.trim() || "Διάβασε αυτή τη φωτογραφία και εξήγαγε ονόματα, ημερομηνίες και ώρες εργασίας." }
          ]
        : txt;
      const r = await callAllyra(buildPrompt(), currentMsgs, msgContent, executeAllyraTool);

      let workingText = r;
      let extractData = null;
      const extractIdx = workingText.indexOf("[EXTRACT:");
      if (extractIdx !== -1) {
        const lastBracket = workingText.lastIndexOf("]");
        const jsonPart = workingText.slice(extractIdx + "[EXTRACT:".length, lastBracket);
        try { extractData = JSON.parse(jsonPart); } catch(err) {
          notify("⚠️ Η γραμματέα προσπάθησε να καταγράψει δεδομένα από φωτογραφία αλλά η μορφή ήταν λανθασμένη (τεχνικό σφάλμα) — δοκίμασε ξανά", "warning");
        }
        workingText = workingText.slice(0, extractIdx).trim();
      }

      const logDateMatch = workingText.match(/\[LOGDATE:(\d{4}-\d{2}-\d{2})\]/);
      const actionMatches = [...workingText.matchAll(/\[ACTION:(\{.*?\})\]/g)];
      let cleanText = workingText;
      let actionDriverId = null;
      let hadLogHoursAction = false;
      if (logDateMatch) {
        cleanText = cleanText.replace(logDateMatch[0], "").trim();
      }
      let customLogDate = detectBackdate(txt, new Date());
      if (!customLogDate && logDateMatch) customLogDate = logDateMatch[1];
      for (const actionMatch of actionMatches) {
        cleanText = cleanText.replace(actionMatch[0], "").trim();
        try {
          const action = JSON.parse(actionMatch[1]);
          if (action.type === "log_hours") hadLogHoursAction = true;
          if (action.type === "update_driver") {
            const isBackdatedTemporary = customLogDate && action.field === "status" && (action.value === "absent");
            if (isBackdatedTemporary) {
              actionDriverId = action.id;
              notify(`Καταχωρήθηκε αναδρομικά (${customLogDate}) — τρέχον status δεν άλλαξε ✓`, "success");
            } else {
              let extraFields = {};
              if (action.field === "status" && action.value === "terminated") {
                const dateIso = customLogDate || new Date().toISOString().slice(0,10);
                extraFields = { terminated_date: dateIso, terminated_reason: txt };
              }
              if (action.field === "status" && action.value === "active") {
                extraFields = { terminated_date: null, terminated_reason: null };
              }
              let coercedValue = action.value;
              if (action.field === "contract_hours_week") coercedValue = parseInt(action.value, 10) || 40;
              setDrivers(prev => prev.map(d => d.id === action.id ? {...d, [action.field]: coercedValue, ...extraFields} : d));
              supabase.from('drivers').update({ [action.field]: coercedValue, ...extraFields }).eq('id', action.id).then(res=>notifySupaError(res,'ενημέρωση οδηγού'));
              actionDriverId = action.id;
              if (action.field === "status") {
                const label = action.value === "terminated" ? "Αποχώρησε/Απολύθηκε" : action.value === "absent" ? "Απών" : "Ενεργός";
                notify(`Status οδηγού: ${label} ✓`, "success");
              } else if (action.field === "contract_hours_week") {
                notify(`Σύμβαση ενημερώθηκε: ${coercedValue} ώρες/βδομάδα ✓`, "success");
              } else {
                notify("Ενημέρωση οδηγού καταχωρήθηκε ✓","success");
              }
            }
          }
          if (action.type === "assign_driver") {
            if (action.removeProjectId) {
              setAssignments(prev => prev.filter(a => !(a.driverId===action.driverId && a.projectId===action.removeProjectId)));
              supabase.from('assignments').delete().eq('driverid', action.driverId).eq('projectid', action.removeProjectId).then(res=>notifySupaError(res,'αφαίρεση ανάθεσης'));
            }
            const newAsg = { driverId:action.driverId, projectId:action.projectId, shift:action.shift||"", days:action.days||"" };
            setAssignments(prev => [...prev, newAsg]);
            supabase.from('assignments').insert({ driverid:action.driverId, projectid:action.projectId, shift:action.shift||"", days:action.days||"" }).then(res=>notifySupaError(res,'ανάθεση'));
            actionDriverId = action.driverId;
            notify("Ανάθεση οδηγού καταχωρήθηκε ✓","success");
          }
          if (action.type === "log_hours") {
            const detectedHours = detectHoursFromText(txt);
            const finalHours = (detectedHours!==null && detectedHours!==undefined) ? detectedHours : (parseFloat(action.hours) || 0);
            const finalDate = customLogDate || new Date().toISOString().slice(0,10);
            const entry = { driverId:action.driverId, date:finalDate, projectId:action.projectId||null, hours:finalHours, note:action.note||txt };
            setDailyHours(prev => [entry, ...prev]);
            supabase.from('daily_hours').insert({ driverid:action.driverId, date:finalDate, projectid:action.projectId||null, hours:finalHours, note:action.note||txt }).then(res=>notifySupaError(res,'καταγραφή ωρών'));
            actionDriverId = action.driverId;
            notify(`Καταγράφηκαν ${finalHours} ώρες (${finalDate}) ✓`, "success");
          }
          if (action.type === "add_partner") {
            const newPartner = { name:action.name||"—", role:action.role||"Συνεργάτης", rate:parseFloat(action.rate)||9.50, notes:action.notes||"" };
            supabase.from('partners').insert(newPartner).select().then(({data,error}) => {
              if (data && data[0]) setPartners(prev => [...prev, data[0]]);
              if (error) notify(`⚠️ Αποτυχία προσθήκης συνεργάτη: ${error.message}`, "warning");
            });
            notify(`Νέος συνεργάτης: ${newPartner.name} ✓`, "success");
            addLog(`Προσθήκη νέου συνεργάτη: ${newPartner.name} (${newPartner.role})`, "partner", null, customLogDate);
          }
          if (action.type === "update_partner") {
            let coercedValue = action.value;
            if (action.field === "rate") coercedValue = parseFloat(action.value) || 0;
            setPartners(prev => prev.map(p => p.id === action.id ? {...p, [action.field]: coercedValue} : p));
            supabase.from('partners').update({ [action.field]: coercedValue }).eq('id', action.id).then(res=>notifySupaError(res,'ενημέρωση συνεργάτη'));
            notify("Ενημέρωση συνεργάτη καταχωρήθηκε ✓","success");
            addLog(`Ενημέρωση συνεργάτη (id:${action.id}): ${action.field} → ${coercedValue}`, "partner", null, customLogDate);
          }
        } catch(err) {
          notify(`⚠️ Η ενέργεια της γραμματέας απέτυχε (τεχνικό σφάλμα: ${err.message}) — τίποτα δεν καταχωρήθηκε`, "warning");
        }
      }
      setMessages(p=>[...p, {role:"assistant", text:cleanText}]);
      supabase.from('chat_messages').insert([
        { role:"user", text:displayText },
        { role:"assistant", text:cleanText }
      ]).then(res=>notifySupaError(res,'αποθήκευση συνομιλίας'));
      const lo=txt.toLowerCase();
      if (lo.includes("απολύ")||lo.includes("απολυ")||lo.includes("παραιτ")||lo.includes("αποχώρησ")||lo.includes("αποχωρησ")) addLog(txt,"terminated",actionDriverId,customLogDate);
      else if (hadLogHoursAction) addLog(txt,"hours",actionDriverId,customLogDate);
      else if (lo.includes("απουσί")||lo.includes("απών")) addLog(txt,"absence",actionDriverId,customLogDate);
      else if (lo.includes("άδεια")||lo.includes("αδεια")) addLog(txt,"leave",actionDriverId,customLogDate);
      else if (lo.includes("αντικατάστα")) addLog(txt,"substitution",actionDriverId,customLogDate);
      else if (lo.includes("μεταφ")||lo.includes("ανάθεσ")||lo.includes("αναθεσ")) addLog(txt,"assignment",actionDriverId,customLogDate);
      else if (lo.includes("project")||lo.includes("έργο")) addLog(txt,"project",actionDriverId,customLogDate);

      const confirmWords = /(σωστ[άό]|σωστες|σωστό|καταχ[ωώ]ρησ|επιβεβαι|✅|👍)/i;
      const cancelWords = /(άκυρο|ακυρο|παράλειψ|παραλειψ|διαγραψ[ετέ]|ξέχνα|ξεχνα)/i;
      const isCancel = cancelWords.test(txt);
      const isConfirm = !isCancel && confirmWords.test(txt);

      if (extractData && Array.isArray(extractData.entries)) {
        if (extractData.entries.length===0) {
          setExtractEntries([]);
        } else {
          const enriched = extractData.entries.map(e => {
            let driverId = e.driverId || null;
            if (!driverId && e.driverNameRaw) {
              const raw = e.driverNameRaw.toLowerCase();
              const match = drivers.find(d => {
                const tokens = d.name.toLowerCase().split(" ").filter(Boolean);
                return d.name.toLowerCase().includes(raw) || tokens.some(tok => tok.length>2 && (raw.includes(tok) || tok.includes(raw)));
              });
              if (match) driverId = match.id;
            }
            let projectId = e.projectId || null;
            if (!projectId && e.projectName) {
              const pmatch = PROJECTS.find(p=>p.name.toLowerCase().includes(e.projectName.toLowerCase()) || e.projectName.toLowerCase().includes(p.name.toLowerCase()));
              if (pmatch) projectId = pmatch.id;
            }
            if (!projectId && driverId) {
              const driverAssignments = assignments.filter(a=>a.driverId===driverId);
              if (driverAssignments.length===1) projectId = driverAssignments[0].projectId;
            }
            return { driverId, driverNameRaw: e.driverNameRaw||"", date: e.date||"", hours: e.hours!=null?e.hours:"", startTime: e.startTime||"", endTime: e.endTime||"", projectId };
          });
          if (isConfirm) {
            commitExtractEntries(enriched);
            setExtractEntries([]);
          } else {
            setExtractEntries(enriched);
          }
        }
      } else if (isCancel && extractEntries.length>0) {
        setExtractEntries([]);
        notify("Ακυρώθηκε η εκκρεμής καταχώρηση","warning");
      } else if (isConfirm && extractEntries.length>0) {
        commitExtractEntries(extractEntries);
        setExtractEntries([]);
      } else if (imageAttachment && !(extractData && Array.isArray(extractData.entries))) {
        notify("⚠️ Δεν εντόπισα δεδομένα προς καταχώρηση — δοκίμασε να στείλεις ξανά τη φωτογραφία", "warning");
      }
    } catch(e) {
      const errMsg = e?.message || "Άγνωστο σφάλμα";
      setMessages(p=>[...p,{role:"assistant",text:`⚠️ Σφάλμα: ${errMsg}`}]);
      notify(`⚠️ ${errMsg}`, "warning");
    }
    finally { setThinking(false); }
  }, [buildPrompt, drivers, assignments, partners, executeAllyraTool, extractEntries, dailyHours]);

  const handleImageSelect = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1600;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.75);
        const base64 = compressedDataUrl.split(",")[1];
        setAttachedImage({ data: base64, mediaType: "image/jpeg", previewUrl: compressedDataUrl });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };

  const updateExtractEntry = (idx, field, value) => {
    setExtractEntries(prev => prev.map((e,i) => i===idx ? {...e, [field]:value} : e));
  };

  const removeExtractEntry = (idx) => {
    setExtractEntries(prev => prev.filter((_,i)=>i!==idx));
  };

  const updateGroupDriver = (idxList, newDriverId) => {
    setExtractEntries(prev => prev.map((e,i) => idxList.includes(i) ? {...e, driverId:newDriverId} : e));
  };

  const updateGroupProject = (idxList, newProjectId) => {
    setExtractEntries(prev => prev.map((e,i) => idxList.includes(i) ? {...e, projectId:newProjectId} : e));
  };

  const addRowToGroup = (driverId, driverNameRaw, projectId) => {
    setExtractEntries(prev => [...prev, { driverId, driverNameRaw, date:"", hours:"", startTime:"", endTime:"", projectId:projectId||null }]);
  };

  const commitExtractEntries = (entriesToCommit) => {
    const valid = entriesToCommit.filter(e => {
      const hasTimes = e.startTime && e.endTime;
      const hasHours = e.hours!=="" && e.hours!=null && !isNaN(parseFloat(e.hours));
      return e.driverId && e.date && (hasTimes || hasHours);
    });
    let savedCount = 0;
    let skippedCount = 0;
    const skippedNoDriver = entriesToCommit.length - valid.length;
    const alreadySeen = [...dailyHours];
    valid.forEach(e => {
      const breakdown = (e.startTime && e.endTime) ? computeShiftBreakdown(e.date, e.startTime, e.endTime) : null;
      const hours = breakdown ? breakdown.total : parseFloat(e.hours);
      const isDup = alreadySeen.some(h =>
        h.driverId===e.driverId && h.date===e.date && h.projectId===(e.projectId||null) &&
        ((e.startTime && e.endTime && h.start_time===e.startTime && h.end_time===e.endTime) ||
         (!e.startTime && Math.abs((parseFloat(h.hours)||0)-hours)<0.01 && !h.start_time))
      );
      if (isDup) { skippedCount++; return; }
      let noteExtra = "";
      if (breakdown) {
        const parts = [];
        if (breakdown.normal>0) parts.push(`${breakdown.normal} κανονικές`);
        if (breakdown.night>0) parts.push(`${breakdown.night} νυχτερινές`);
        if (breakdown.sunday>0) parts.push(`${breakdown.sunday} Κυριακή/αργία`);
        if (breakdown.sundayNight>0) parts.push(`${breakdown.sundayNight} Κυριακή/αργία+νύχτα`);
        noteExtra = ` (${e.startTime}-${e.endTime}: ${parts.join(", ")})`;
      }
      const entry = { driverId:e.driverId, date:e.date, projectId:e.projectId||null, hours, note:`Από φωτογραφία (${e.driverNameRaw||""})${noteExtra}`, start_time:e.startTime||null, end_time:e.endTime||null };
      alreadySeen.push(entry);
      setDailyHours(prev => [entry, ...prev]);
      supabase.from('daily_hours').insert({ driverid:e.driverId, date:e.date, projectid:e.projectId||null, hours, note:entry.note, start_time:e.startTime||null, end_time:e.endTime||null }).then(res=>notifySupaError(res,'καταχώρηση από φωτογραφία'));
      addLog(`Καταχώρηση από φωτογραφία: ${drivers.find(d=>d.id===e.driverId)?.name||e.driverNameRaw} — ${hours} ώρες${noteExtra}`, "hours", e.driverId, e.date);
      savedCount++;
    });
    let msg = `Καταχωρήθηκαν ${savedCount} εγγραφές ✓`;
    if (skippedCount>0) msg += ` — παραλείφθηκαν ${skippedCount} διπλότυπα`;
    if (skippedNoDriver>0) msg += ` — ${skippedNoDriver} χωρίς αντιστοιχισμένο οδηγό δεν καταχωρήθηκαν`;
    notify(msg, skippedCount>0||skippedNoDriver>0 ? "warning" : "success");
  };

  const deleteDailyHour = (entryId) => {
    if (!entryId) { notify("Αυτή η εγγραφή δεν έχει αναγνωριστικό — ανανέωσε τη σελίδα","warning"); return; }
    setDailyHours(prev => prev.filter(h => h.id !== entryId));
    supabase.from('daily_hours').delete().eq('id', entryId).then(res=>notifySupaError(res,'διαγραφή καταγραφής'));
    notify("Η καταγραφή διαγράφηκε ✓","success");
  };

  const saveManualHour = (driverId) => {
    if (!driverId || !manualHour.date) { notify("Συμπλήρωσε τουλάχιστον οδηγό και ημερομηνία","warning"); return; }
    const hasTimes = manualHour.startTime && manualHour.endTime;
    const hasHours = manualHour.hours!=="" && !isNaN(parseFloat(manualHour.hours));
    if (!hasTimes && !hasHours) { notify("Βάλε ώρα εισόδου/εξόδου ή αριθμό ωρών","warning"); return; }
    const breakdown = hasTimes ? computeShiftBreakdown(manualHour.date, manualHour.startTime, manualHour.endTime) : null;
    const hours = breakdown ? breakdown.total : parseFloat(manualHour.hours);
    const isDup = dailyHours.some(h => h.driverId===driverId && h.date===manualHour.date && h.projectId===(manualHour.projectId||null) &&
      ((hasTimes && h.start_time===manualHour.startTime && h.end_time===manualHour.endTime) ||
       (!hasTimes && Math.abs((parseFloat(h.hours)||0)-hours)<0.01 && !h.start_time)));
    if (isDup) { notify("Υπάρχει ήδη ίδια καταγραφή αυτή την ημέρα — δεν προστέθηκε ξανά","warning"); return; }
    const note = `Χειροκίνητη καταχώρηση${hasTimes?` (${manualHour.startTime}-${manualHour.endTime})`:""}`;
    const entry = { driverId, date:manualHour.date, projectId:manualHour.projectId||null, hours, note, start_time:manualHour.startTime||null, end_time:manualHour.endTime||null };
    setDailyHours(prev => [entry, ...prev]);
    supabase.from('daily_hours').insert({ driverid:driverId, date:manualHour.date, projectid:manualHour.projectId||null, hours, note, start_time:manualHour.startTime||null, end_time:manualHour.endTime||null }).then(res=>notifySupaError(res,'χειροκίνητη καταχώρηση ώρας'));
    addLog(`${note}: ${drivers.find(d=>d.id===driverId)?.name||""} — ${hours} ώρες`, "hours", driverId, manualHour.date);
    notify("Καταχωρήθηκε ✓","success");
    setManualHour({ date:"", startTime:"", endTime:"", hours:"", projectId:null });
    setManualHourOpen(false);
  };

  const saveManualAbsence = (driverId) => {
    if (!driverId || !manualAbsence.date) { notify("Συμπλήρωσε τουλάχιστον οδηγό και ημερομηνία","warning"); return; }
    const driver = drivers.find(d=>d.id===driverId);
    const driverName = driver?.name || "";
    const maxWeekday = (driver?.work_days===6) ? 6 : 5;
    const label = manualAbsence.type==="leave" ? "άδεια" : "απών";
    const baseText = manualAbsence.text.trim() || `${driverName} ήταν ${label}`;

    const startDate = new Date(manualAbsence.date+"T00:00:00");
    const endDate = manualAbsence.dateTo ? new Date(manualAbsence.dateTo+"T00:00:00") : startDate;
    if (endDate < startDate) { notify("Η ημερομηνία \"έως\" πρέπει να είναι μετά την \"από\"","warning"); return; }

    let count = 0;
    const cursor = new Date(startDate);
    while (cursor <= endDate) {
      const dow = cursor.getDay();
      if (dow>=1 && dow<=maxWeekday) {
        const dateStr = `${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,"0")}-${String(cursor.getDate()).padStart(2,"0")}`;
        addLog(baseText, manualAbsence.type, driverId, dateStr);
        count++;
      }
      cursor.setDate(cursor.getDate()+1);
    }
    notify(`Καταχωρήθηκαν ${count} εργάσιμες ημέρες ✓`,"success");
    setManualAbsence({ type:"absence", date:"", dateTo:"", text:"" });
    setManualAbsenceOpen(false);
  };

    const record = {
      name: newDriver.name.trim(),
      phone: newDriver.phone.trim(),
      moto: newDriver.moto.trim()||"—",
      motoType: newDriver.motoType,
      area: newDriver.area.trim(),
      status: "active",
      contract_hours_week: parseInt(newDriver.contract_hours_week,10)||40,
      work_days: newDriver.work_days===6?6:5
    };
    supabase.from('drivers').insert(record).select().then(({data,error}) => {
      if (data && data[0]) setDrivers(prev => [...prev, data[0]]);
      if (error) notify(`⚠️ Αποτυχία προσθήκης οδηγού: ${error.message}`, "warning");
    });
    notify(`Νέος οδηγός: ${record.name} ✓`,"success");
    addLog(`Προσθήκη νέου οδηγού: ${record.name}`, "system", null);
    setNewDriver({ name:"", phone:"", moto:"", motoType:"company", area:"", contract_hours_week:"40", work_days:5 });
    setNewDriverOpen(false);
  };

  const saveNewPartner = () => {
    if (!newPartner.name.trim()) { notify("Βάλε τουλάχιστον όνομα","warning"); return; }
    let role = newPartner.role.trim();
    if (newEntryType==="contractor" && !role) role = "Εργολάβος (ο ίδιος)";
    if (newEntryType==="partner" && !role) role = "Εξωτερικός Συνεργάτης";
    if (newEntryType==="contractor_driver") {
      const parent = partners.find(p=>p.id===newPartnerParentId);
      if (!parent) { notify("Διάλεξε ποιανού εργολάβου είναι ο οδηγός","warning"); return; }
      role = `Οδηγός ${parent.name}`;
    }
    const record = { name:newPartner.name.trim(), role:role||"Συνεργάτης", rate:parseFloat(newPartner.rate)||9.50, notes:newPartner.notes.trim() };
    supabase.from('partners').insert(record).select().then(({data,error}) => {
      if (data && data[0]) setPartners(prev => [...prev, data[0]]);
      if (error) notify(`⚠️ Αποτυχία προσθήκης συνεργάτη: ${error.message}`, "warning");
    });
    notify(`Νέος συνεργάτης: ${record.name} ✓`,"success");
    addLog(`Προσθήκη νέου συνεργάτη: ${record.name} (${record.role})`, "partner", null);
    setNewPartner({ name:"", role:"", rate:"9.50", notes:"" });
    setNewPartnerParentId(null);
    setNewPartnerOpen(false);
  };

  const startListen = () => {
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if (!SR) { notify("Χρησιμοποίησε Chrome για φωνή","warning"); return; }
    const r=new SR(); r.lang="el-GR"; r.continuous=false; r.interimResults=false;
    r.onstart=()=>setListening(true); r.onend=()=>setListening(false);
    r.onresult=e=>{ const t=e.results[0][0].transcript; setInput(t); setTimeout(()=>sendMsg(t,messages),300); };
    r.onerror=()=>{ setListening(false); notify("Δεν άκουσα. Ξαναπροσπάθησε.","warning"); };
    recRef.current=r; r.start();
  };

  const calcResult = () => {
    const h=parseFloat(calcH)||0; if(!h) return null;
    let rate = calcDT==="partner" ? (calcMoto==="own"?9.50:8.50) : RATES[calcMoto][calcType];
    return {h, rate, total:(h*rate).toFixed(2)};
  };

  const parseLogDate = (ts) => {
    const m = (ts||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (!m) return null;
    return { day:parseInt(m[1],10), month:parseInt(m[2],10), year:parseInt(m[3],10) };
  };

  const parseRangeDays = (text, refYear, refMonth) => {
    const m = (text||"").match(/(\d{1,2})\s*-\s*(\d{1,2})\/(\d{1,2})/);
    if (m) {
      const d1=parseInt(m[1],10), d2=parseInt(m[2],10), mo=parseInt(m[3],10);
      if (d2>=d1) {
        if (refYear) {
          let weekdays = 0;
          for (let day=d1; day<=d2; day++) {
            const dow = new Date(refYear, mo-1, day).getDay();
            if (dow>=1 && dow<=5) weekdays++;
          }
          return weekdays;
        }
        return d2-d1+1;
      }
    }
    return 1;
  };

  const mondayOfWeek = (dateObj) => {
    const d = new Date(dateObj);
    const day = d.getDay();
    const diff = day===0 ? -6 : 1-day;
    d.setDate(d.getDate()+diff);
    d.setHours(0,0,0,0);
    return d;
  };

  const computeMonthlyReport = (driverId, monthStr) => {
    const driver = drivers.find(d=>d.id===driverId);
    if (!driver) return null;
    const [yy,mm] = monthStr.split("-").map(Number);
    const daysInMonth = new Date(yy, mm, 0).getDate();
    const contractWeek = driver.contract_hours_week || 40;
    const workDays = driver.work_days===6 ? 6 : 5;
    const dailyEquivalent = contractWeek / workDays;
    const baselineMonthlyHours = (contractWeek/7) * daysInMonth;

    const monthLogEntries = log.filter(l => l.driverId===driverId && (() => {
      const d = parseLogDate(l.ts); return d && d.year===yy && d.month===mm;
    })());
    const monthHoursEntries = dailyHours.filter(h => h.driverId===driverId && h.date && h.date.startsWith(monthStr));

    let absenceDaysTotal = 0;
    monthLogEntries.filter(l=>l.type==="absence"||l.type==="leave").forEach(l => {
      absenceDaysTotal += parseRangeDays(l.text, yy, mm);
    });

    let hoursDeltaTotal = 0;
    const hoursByDate = {};
    monthHoursEntries.forEach(h => {
      const key = h.date;
      hoursByDate[key] = (hoursByDate[key]||0) + (parseFloat(h.hours)||0);
    });
    const hourEntryDetails = monthHoursEntries.map(h => {
      const delta = (parseFloat(h.hours)||0) - dailyEquivalent;
      return { ...h, delta };
    });
    Object.values(hoursByDate).forEach(dayTotal => {
      hoursDeltaTotal += (dayTotal - dailyEquivalent);
    });

    const absenceHoursLost = absenceDaysTotal * dailyEquivalent;
    const estimatedTotal = baselineMonthlyHours - absenceHoursLost + hoursDeltaTotal;
    const overtimeEstimate = hourEntryDetails.filter(h=>h.delta>0).reduce((s,h)=>s+h.delta,0);

    // --- Time-of-day category breakdown from logged entries (only these carry granularity) ---
    let loggedNight=0, loggedSunday=0, loggedSundayNight=0;
    const entryBreakdowns = monthHoursEntries.map(h => {
      let b;
      if (h.start_time && h.end_time) b = computeShiftBreakdown(h.date, h.start_time, h.end_time);
      else {
        const dow = new Date(h.date+"T00:00:00Z").getUTCDay();
        const special = dow===0 || isGreekHoliday(h.date);
        const hrs = parseFloat(h.hours)||0;
        b = special ? {normal:0,night:0,sunday:hrs,sundayNight:0,total:hrs} : {normal:hrs,night:0,sunday:0,sundayNight:0,total:hrs};
      }
      loggedNight += b.night; loggedSunday += b.sunday; loggedSundayNight += b.sundayNight;
      return { ...h, breakdown:b };
    });

    // --- Weekly overtime: compare each week's total (logged + assumed baseline for unlogged weekdays) to contractWeek ---
    const loggedDatesSet = new Set(monthHoursEntries.map(h=>h.date));
    const weeks = {};
    for (let day=1; day<=daysInMonth; day++) {
      const dateObj = new Date(yy, mm-1, day);
      const dateStr = `${yy}-${String(mm).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const wk = mondayOfWeek(dateObj).toISOString().slice(0,10);
      if (!weeks[wk]) weeks[wk] = { loggedHours:0, unloggedWeekdays:0 };
      const dow = dateObj.getDay();
      if (loggedDatesSet.has(dateStr)) {
        const dayTotal = entryBreakdowns.filter(e=>e.date===dateStr).reduce((s,e)=>s+e.breakdown.total,0);
        weeks[wk].loggedHours += dayTotal;
      } else if (dow>=1 && dow<=workDays) {
        weeks[wk].unloggedWeekdays += 1;
      }
    }
    let totalOvertimeHours = 0;
    Object.values(weeks).forEach(w => {
      const weekTotal = w.loggedHours + w.unloggedWeekdays*dailyEquivalent;
      totalOvertimeHours += Math.max(0, weekTotal - contractWeek);
    });

    const nightHoursForPay = loggedNight;
    const sundayHoursForPay = loggedSunday + loggedSundayNight;
    const overtimeHoursForPay = totalOvertimeHours;
    const normalHoursForPay = Math.max(0, estimatedTotal - overtimeHoursForPay - nightHoursForPay - sundayHoursForPay);

    const rateTable = RATES[driver.motoType] || RATES.company;
    const payrollCost = normalHoursForPay*rateTable.normal + overtimeHoursForPay*rateTable.overtime + nightHoursForPay*rateTable.night + sundayHoursForPay*rateTable.sunday;

    return {
      driver, contractWeek, dailyEquivalent, daysInMonth, baselineMonthlyHours,
      absenceDaysTotal, absenceHoursLost, hourEntryDetails, hoursDeltaTotal,
      estimatedTotal, overtimeEstimate, monthLogEntries,
      normalHoursForPay, overtimeHoursForPay, nightHoursForPay, sundayHoursForPay, payrollCost, rateTable
    };
  };

  const parseShiftHours = (shift) => {
    const m = (shift||"").match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
    if (!m) return 0;
    const h1=parseInt(m[1],10), mi1=parseInt(m[2],10), h2=parseInt(m[3],10), mi2=parseInt(m[4],10);
    let mins = (h2*60+mi2)-(h1*60+mi1);
    if (mins<0) mins += 24*60;
    return mins/60;
  };

  const parseDaysPerWeek = (daysStr) => {
    const s = (daysStr||"").toLowerCase();
    if (!s) return 5;
    if (s.includes("καθημερ")) return 7;
    if (s.includes("δευ-σαβ")) return 6;
    if (s.includes("δευ-παρ")) return 5;
    const tokens = ["δευ","τρι","τετ","πεμ","παρ","σαβ","κυρ"];
    const count = tokens.filter(tok=>s.includes(tok)).length;
    return count>0 ? count : 5;
  };

  const saveCalendarEntry = (dateStr) => {
    const { driverId, startTime, endTime, hours } = calendarAddForm;
    if (!driverId) { notify("Διάλεξε οδηγό","warning"); return; }
    const hasTimes = startTime && endTime;
    const hasHours = hours!=="" && !isNaN(parseFloat(hours));
    if (!hasTimes && !hasHours) { notify("Βάλε ώρα εισόδου/εξόδου ή αριθμό ωρών","warning"); return; }
    const breakdown = hasTimes ? computeShiftBreakdown(dateStr, startTime, endTime) : null;
    const finalHours = breakdown ? breakdown.total : parseFloat(hours);
    const isDup = dailyHours.some(h => h.driverId===driverId && h.date===dateStr && h.projectId===(calendarProjectId||null) &&
      ((hasTimes && h.start_time===startTime && h.end_time===endTime) ||
       (!hasTimes && Math.abs((parseFloat(h.hours)||0)-finalHours)<0.01 && !h.start_time)));
    if (isDup) { notify("Υπάρχει ήδη ίδια καταγραφή αυτή την ημέρα","warning"); return; }
    const note = `Χειροκίνητη καταχώρηση (ημερολόγιο)${hasTimes?` (${startTime}-${endTime})`:""}`;
    const entry = { driverId, date:dateStr, projectId:calendarProjectId, hours:finalHours, note, start_time:startTime||null, end_time:endTime||null };
    setDailyHours(prev => [entry, ...prev]);
    supabase.from('daily_hours').insert({ driverid:driverId, date:dateStr, projectid:calendarProjectId, hours:finalHours, note, start_time:startTime||null, end_time:endTime||null }).then(res=>notifySupaError(res,'προσθήκη στο ημερολόγιο'));
    addLog(`${note}: ${drivers.find(d=>d.id===driverId)?.name||""} — ${finalHours} ώρες`, "hours", driverId, dateStr);
    notify("Καταχωρήθηκε ✓","success");
    setCalendarAddDate(null);
    setCalendarAddForm({ driverId:null, startTime:"", endTime:"", hours:"" });
  };

  const computeProjectCalendar = (projectId, monthStr) => {
    const project = PROJECTS.find(p=>p.id===projectId);
    if (!project) return null;
    const [yy,mm] = monthStr.split("-").map(Number);
    const daysInMonth = new Date(yy, mm, 0).getDate();
    const WEEKDAY_NAMES = ["Κυρ","Δευ","Τρι","Τετ","Πεμ","Παρ","Σαβ"];

    const entries = dailyHours.filter(h => h.projectId===projectId && h.date && h.date.startsWith(monthStr));

    const days = [];
    for (let day=1; day<=daysInMonth; day++) {
      const dateStr = `${yy}-${String(mm).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const dateObj = new Date(yy, mm-1, day);
      const dayEntries = entries.filter(e=>e.date===dateStr).map(e => {
        const dr = drivers.find(d=>d.id===e.driverId);
        const timeStr = (e.start_time && e.end_time) ? `${e.start_time}-${e.end_time}` : `${e.hours}ω`;
        return { id: e.id, driverName: dr?dr.name:`(id:${e.driverId})`, timeStr, hours:e.hours };
      });
      days.push({ day, dateStr, weekday: WEEKDAY_NAMES[dateObj.getDay()], entries: dayEntries });
    }

    return { project, daysInMonth, days };
  };

  const computeProjectMonthlyReport = (projectId, monthStr) => {
    const project = PROJECTS.find(p=>p.id===projectId);
    if (!project) return null;
    const [yy,mm] = monthStr.split("-").map(Number);
    const daysInMonth = new Date(yy, mm, 0).getDate();
    const weeksInMonth = daysInMonth/7;

    const projectAssignments = assignments.filter(a=>a.projectId===projectId);
    let baselineTotal = 0;
    let totalCost = 0;
    const driverLines = [];
    const ambiguousNotes = [];

    projectAssignments.forEach(a => {
      const driver = drivers.find(d=>d.id===a.driverId);
      if (!driver) return;
      const shiftHours = parseShiftHours(a.shift);
      const daysPerWeek = parseDaysPerWeek(a.days);
      const baseline = shiftHours * daysPerWeek * weeksInMonth;

      const driverProjectCount = assignments.filter(x=>x.driverId===a.driverId).length;
      let absenceHours = 0;
      if (driverProjectCount === 1) {
        const driverAbsences = log.filter(l => l.driverId===a.driverId && (l.type==="absence"||l.type==="leave") && (() => {
          const d = parseLogDate(l.ts); return d && d.year===yy && d.month===mm;
        })());
        let absenceDays = 0;
        driverAbsences.forEach(l => { absenceDays += parseRangeDays(l.text, yy, mm); });
        absenceHours = absenceDays * shiftHours;
      } else if (driverProjectCount > 1) {
        const hasAbsence = log.some(l => l.driverId===a.driverId && (l.type==="absence"||l.type==="leave") && (() => {
          const d = parseLogDate(l.ts); return d && d.year===yy && d.month===mm;
        })());
        if (hasAbsence) ambiguousNotes.push(`${driver.name} έχει καταγεγραμμένη απουσία αλλά δουλεύει σε ${driverProjectCount} projects — έλεγξε χειροκίνητα ποιο project επηρεάζεται.`);
      }

      const projectHoursEntries = dailyHours.filter(h => h.driverId===a.driverId && h.projectId===projectId && h.date && h.date.startsWith(monthStr));
      let delta = 0;
      const catHours = { normal:0, night:0, sunday:0, sundayNight:0 };
      let hasRecordedTimes = false;
      projectHoursEntries.forEach(h => {
        delta += (parseFloat(h.hours)||0) - shiftHours;
        if (h.start_time && h.end_time) {
          const b = computeShiftBreakdown(h.date, h.start_time, h.end_time);
          if (b) { catHours.normal+=b.normal; catHours.night+=b.night; catHours.sunday+=b.sunday; catHours.sundayNight+=b.sundayNight; hasRecordedTimes=true; }
        }
      });

      const finalHours = baseline - absenceHours + delta;
      baselineTotal += finalHours;

      let lineCost;
      if (hasRecordedTimes) {
        const recordedTotal = catHours.normal+catHours.night+catHours.sunday+catHours.sundayNight;
        const remainingNormal = Math.max(0, finalHours - recordedTotal);
        lineCost = (catHours.normal+remainingNormal)*(project.rateDay||0)
          + catHours.night*(project.rateNight||project.rateDay||0)
          + catHours.sunday*(project.rateSun||project.rateDay||0)
          + catHours.sundayNight*(project.rateSunNight||project.rateSun||project.rateNight||project.rateDay||0);
      } else {
        lineCost = finalHours * (project.rateDay||0);
      }
      totalCost += lineCost;
      driverLines.push({ driver, shiftHours, daysPerWeek, baseline, absenceHours, delta, finalHours, catHours, hasRecordedTimes, lineCost });
    });

    const cost = totalCost;

    return { project, daysInMonth, driverLines, totalHours:baselineTotal, cost, ambiguousNotes };
  };

  const activeD=drivers.filter(d=>d.status==="active").length;
  const absentD=drivers.filter(d=>d.status==="absent").length;
  const terminatedD=drivers.filter(d=>d.status==="terminated").length;
  const assignedD=[...new Set(assignments.map(a=>a.driverId))].length;
  const activeP=PROJECTS.filter(p=>p.status==="active").length;

  const filtD=drivers.filter(d=>
    (driversView==="archived" ? d.status==="terminated" : driversView==="absent" ? d.status==="absent" : d.status!=="terminated") &&
    (

      (d.area||"").toLowerCase().includes(search.toLowerCase())||
      d.moto.toLowerCase().includes(search.toLowerCase())
    )
  );
  const filtP=PROJECTS.filter(p=>
    (catFilter==="all"||p.cat===catFilter)&&
    (p.name.toLowerCase().includes(search.toLowerCase())||p.client.toLowerCase().includes(search.toLowerCase()))
  );

  const S = {
    app:{background:"#0a0f1e",color:"#e8eaf6",minHeight:"100vh",fontFamily:"'Segoe UI',sans-serif"},
    topBar:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",background:"#0d1428",borderBottom:"1px solid #1e2a4a",position:"sticky",top:0,zIndex:100},
    logo:{fontSize:20,fontWeight:900,letterSpacing:6,color:"#00e5a0"},
    content:{paddingBottom:80},
    view:{padding:"16px"},
    card:{background:"#0d1428",border:"1px solid #1e2a4a",borderRadius:12,padding:14,marginBottom:10},

    cardSub:{fontSize:12,color:"#778",lineHeight:1.7},

    bottomNav:{display:"flex",justifyContent:"space-around",alignItems:"center",background:"#0d1428",borderTop:"1px solid #1e2a4a",padding:"10px 0 14px",position:"fixed",bottom:0,left:0,right:0,zIndex:100},
    navBtn:{display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"4px 8px",fontFamily:"inherit"},
    searchBar:{display:"flex",alignItems:"center",gap:8,background:"#0d1428",border:"1px solid #1e2a4a",borderRadius:30,padding:"10px 14px",marginBottom:12,color:"#445"},
    searchInput:{flex:1,background:"none",border:"none",color:"#e8eaf6",fontSize:13,outline:"none",fontFamily:"inherit"},
    chatPanel:{position:"fixed",bottom:70,left:0,right:0,background:"#0d1428",borderTop:"2px solid #00e5a0",borderRadius:"20px 20px 0 0",display:"flex",flexDirection:"column",height:"65vh",zIndex:200},
    msgs:{flex:1,overflowY:"auto",padding:"12px 14px",display:"flex",flexDirection:"column",gap:8},
    bubble:{maxWidth:"82%",padding:"10px 14px",fontSize:14,lineHeight:1.5,fontWeight:500},
    inputRow:{display:"flex",gap:6,padding:"10px 12px",borderTop:"1px solid #1e2a4a",alignItems:"center"},
    textInput:{flex:1,background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:18,padding:"10px 16px",color:"#e8eaf6",fontSize:14,fontFamily:"inherit",outline:"none",resize:"none",lineHeight:1.4,maxHeight:110,overflowY:"auto"},
    overlay:{position:"fixed",inset:0,background:"#000b",zIndex:500,display:"flex",alignItems:"flex-end"},
    modal:{background:"#0d1428",border:"2px solid #f5c518",borderRadius:"20px 20px 0 0",width:"100%",maxHeight:"88vh",display:"flex",flexDirection:"column"},
  };

  const TABS = [
    {id:"home",     emoji:"🏠", label:"Αρχή"},
    {id:"drivers",  emoji:"👤", label:"Οδηγοί"},
    {id:"projects", emoji:"📋", label:"Projects"},
    {id:"partners", emoji:"🤝", label:"Συνεργάτες"},
    {id:"log",      emoji:"📝", label:"Αρχείο"},
  ];

  return (
    <div style={S.app}>
      {notif && <div style={{position:"fixed",top:60,left:"50%",transform:"translateX(-50%)",background:notif.type==="success"?"#00e5a0":notif.type==="warning"?"#f5c518":"#5b8cff",color:"#0a0f1e",fontWeight:700,fontSize:13,padding:"10px 20px",borderRadius:30,zIndex:9999,whiteSpace:"nowrap"}}>{notif.text}</div>}

      <div style={S.topBar}>
        <div style={S.logo}>ALLYRA</div>
        <div style={{display:"flex",gap:8}}>
          <button style={{width:36,height:36,borderRadius:"50%",background:"#f5c51822",border:"1px solid #f5c518",color:"#f5c518",cursor:"pointer",fontSize:16}} onClick={()=>setCalcOpen(true)}>€</button>
          <button style={{display:"flex",alignItems:"center",padding:"6px 12px",borderRadius:30,cursor:"pointer",fontFamily:"inherit",background:chatOpen?"#ff6b6b22":"#00e5a022",color:chatOpen?"#ff6b6b":"#00e5a0",border:`1px solid ${chatOpen?"#ff6b6b":"#00e5a0"}`}} onClick={()=>setChatOpen(v=>!v)}>
            <span style={{fontSize:14}}>{chatOpen?"✕":"🎙"}</span>
            <span style={{marginLeft:5,fontSize:12,fontWeight:700}}>{chatOpen?"Κλείσιμο":"ALLYRA AI"}</span>
          </button>
        </div>
      </div>

      <div style={S.content}>
        {tab==="home" && (
          <div style={S.view}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div>
                <div style={{fontSize:22,fontWeight:700}}>Καλημέρα, Alex</div>
                <div style={{fontSize:12,color:"#556",marginTop:2}}>{new Date().toLocaleDateString("el-GR",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</div>
              </div>
              <div style={{width:44,height:44,borderRadius:"50%",background:"linear-gradient(135deg,#00e5a0,#5b8cff)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:900,color:"#0a0f1e"}}>A</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
              {[
                {label:"Σύνολο Οδηγών",value:drivers.length,color:"#00e5a0",onClick:()=>{setTab("drivers");setDriversView("active");}},
                {label:"Ενεργά Projects",value:activeP,color:"#5b8cff",onClick:()=>{setTab("projects");setCatFilter("all");}},
                {label:"Σε Project",value:assignedD,color:"#f5c518",onClick:()=>{setTab("drivers");setDriversView("active");}},
                {label:"Απόντες",value:absentD,color:"#ff6b6b",onClick:()=>{setTab("drivers");setDriversView("absent");}},
              ].map((k,i)=>(
                <button key={i} style={{...S.card,borderTop:`3px solid ${k.color}`,textAlign:"left",cursor:"pointer",fontFamily:"inherit",border:"1px solid #1e2a4a",borderTopWidth:3,borderTopColor:k.color,width:"100%"}} onClick={k.onClick}>
                  <div style={{fontSize:26,fontWeight:900,color:k.color}}>{k.value}</div>
                  <div style={{fontSize:11,color:"#778"}}>{k.label}</div>
                </button>
              ))}

                        {drivers.filter(d=>d.status!=="terminated").map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
                      </select>
                      <select style={{width:"100%",background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:8,padding:"8px 10px",color:"#e8eaf6",fontSize:13,fontFamily:"inherit",marginBottom:8}} value={g.projectId||""} onChange={ev=>updateGroupProject(g.idxs, parseInt(ev.target.value,10)||null)}>
                        <option value="">— Χωρίς σύνδεση με project —</option>
                        {PROJECTS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                      {items.map((it,ii) => (
                        <div key={it.idx} style={{marginBottom:8,paddingBottom:8,borderBottom:ii<items.length-1?"1px solid #1e2a4a":"none"}}>
                          <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:4}}>
                            <input type="date" style={{flex:1,background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:8,padding:"7px 8px",color:"#e8eaf6",fontSize:12,fontFamily:"inherit"}} value={it.date} onChange={ev=>updateExtractEntry(it.idx,"date",ev.target.value)}/>
                            <button style={{background:"none",border:"none",color:"#ff6b6b",fontSize:14,cursor:"pointer",flexShrink:0}} onClick={()=>removeExtractEntry(it.idx)}>✕</button>
                          </div>
                          <div style={{display:"flex",gap:6,alignItems:"center"}}>
                            <input type="time" style={{flex:1,background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:8,padding:"7px 8px",color:"#e8eaf6",fontSize:12,fontFamily:"inherit"}} value={it.startTime||""} onChange={ev=>updateExtractEntry(it.idx,"startTime",ev.target.value)}/>
                            <span style={{color:"#556",fontSize:12}}>έως</span>
                            <input type="time" style={{flex:1,background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:8,padding:"7px 8px",color:"#e8eaf6",fontSize:12,fontFamily:"inherit"}} value={it.endTime||""} onChange={ev=>updateExtractEntry(it.idx,"endTime",ev.target.value)}/>
                            <input type="number" step="0.1" placeholder="ή ώρες" style={{width:64,background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:8,padding:"7px 8px",color:"#e8eaf6",fontSize:12,fontFamily:"inherit"}} value={it.hours} onChange={ev=>updateExtractEntry(it.idx,"hours",ev.target.value)}/>
                          </div>
                          {itemBreakdowns[ii] && (it.startTime && it.endTime) && (
                            <div style={{fontSize:10,color:"#5b8cff",marginTop:3}}>
                              {itemBreakdowns[ii].normal>0 && `${itemBreakdowns[ii].normal}κ `}
                              {itemBreakdowns[ii].night>0 && `${itemBreakdowns[ii].night}ν `}
                              {itemBreakdowns[ii].sunday>0 && `${itemBreakdowns[ii].sunday}Κυρ `}
                              {itemBreakdowns[ii].sundayNight>0 && `${itemBreakdowns[ii].sundayNight}Κυρ+ν `}
                              ={itemBreakdowns[ii].total} ώρες
                            </div>
                          )}
                        </div>
                      ))}
                      <button style={{background:"none",border:"none",color:"#5b8cff",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",padding:0,marginBottom:8}} onClick={()=>addRowToGroup(g.driverId, g.driverNameRaw, g.projectId)}>
                        + Προσθήκη ημέρας
                      </button>
                      <div style={{borderTop:"1px solid #1e2a4a",paddingTop:8}}>
                        <div style={{fontSize:11,color:"#778",marginBottom:4}}>
                          {totals.normal>0 && `Κανονικές: ${totals.normal.toFixed(2)}  `}
                          {totals.night>0 && `Νυχτερινές: ${totals.night.toFixed(2)}  `}
                          {totals.sunday>0 && `Κυριακή/Αργία: ${totals.sunday.toFixed(2)}  `}
                          {totals.sundayNight>0 && `Κυρ+Νύχτα: ${totals.sundayNight.toFixed(2)}`}
                        </div>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                          <div style={{fontSize:13,fontWeight:700,color:"#e8eaf6"}}>Σύνολο: {totals.total.toFixed(2)} ώρες</div>
                          {cost!==null && <div style={{fontSize:13,fontWeight:700,color:"#00e5a0"}}>≈ {fmtEur(cost)}</div>}
                        </div>
                      </div>
                    </div>
                  );
                });
              })()}
              <button style={{width:"100%",background:"#00e5a0",border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:800,color:"#0a0f1e",cursor:"pointer",fontFamily:"inherit",marginTop:8}} onClick={()=>{commitExtractEntries(extractEntries);setExtractOpen(false);setExtractEntries([]);}}>
                ✅ Καταχώρηση όλων
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
