async function callAllyra(sys, history, newMsg) {
  const messages = [
    ...history.slice(-10).map(m => ({ role: m.role==="user"?"user":"assistant", content: m.text })),
    { role:"user", content:newMsg }
  ];
  const res = await fetch("/api/chat", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ system: sys, messages }),
  });
  const d = await res.json();
  return d.content?.[0]?.text || "Δεν κατάλαβα. Δοκίμασε ξανά.";
}

const WEEKDAYS_EL = {
  "κυριακη":0,"κυριακή":0,
  "δευτερα":1,"δευτέρα":1,
  "τριτη":2,"τρίτη":2,
  "τεταρτη":3,"τετάρτη":3,

};

function detectBackdate(text, refDate) {
  const t = text.toLowerCase();
  const today = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

  if (/προχθ[εέ]ς|προχτ[εέ]ς/.test(t)) {
    return fmt(new Date(today.getTime()-2*86400000));
  }
  if (/χθ[εέ]ς|χτ[εέ]ς/.test(t)) {
    return fmt(new Date(today.getTime()-86400000));
  }
  const priorDays = t.match(/πριν\s+(\d+)\s*μ[εέ]ρ/);
  if (priorDays) {
    const n = parseInt(priorDays[1],10);
    return fmt(new Date(today.getTime()-n*86400000));
  }
  const dm = t.match(/(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?/);
  if (dm) {
    let d=parseInt(dm[1],10), m=parseInt(dm[2],10), y=dm[3]?parseInt(dm[3],10):today.getFullYear();
    if (y<100) y+=2000;
    const dt = new Date(y, m-1, d);
    if (!isNaN(dt.getTime()) && dt.getTime() <= today.getTime()) return fmt(dt);
  }
  for (const [name, idx] of Object.entries(WEEKDAYS_EL)) {
    if (t.includes(name)) {
      let diff = (today.getDay() - idx + 7) % 7;
      if (diff === 0) diff = 7;
      return fmt(new Date(today.getTime() - diff*86400000));
    }
  }
  return null;
}

function renderChatText(text) {
  const lines = (text||"").split("\n");
  return lines.map((line, li) => {
    const segments = line.split(/(\*\*[^*]+\*\*)/g).filter(s => s !== "");
    return (
      <div key={li} style={{minHeight: line===""?8:undefined}}>
        {segments.map((seg, si) => {
          if (seg.startsWith("**") && seg.endsWith("**") && seg.length>4) {
            return <strong key={si}>{seg.slice(2,-2)}</strong>;
          }
          return <span key={si}>{seg}</span>;
        })}
      </div>
    );
  });
}

function detectHoursFromText(text) {
  const t = text.toLowerCase();
  const rangeMatch = t.match(/(\d{1,2}):(\d{2})\s*(?:-|έως|ως|μέχρι)\s*(\d{1,2}):(\d{2})/);
  if (rangeMatch) {
    const h1=parseInt(rangeMatch[1],10), m1=parseInt(rangeMatch[2],10);
    const h2=parseInt(rangeMatch[3],10), m2=parseInt(rangeMatch[4],10);
    let mins = (h2*60+m2) - (h1*60+m1);
    if (mins < 0) mins += 24*60;
    return Math.round((mins/60)*100)/100;
  }
  const hoursMatch = t.match(/(\d+(?:[.,]\d+)?)\s*ώρ/);
  if (hoursMatch) {
    return parseFloat(hoursMatch[1].replace(",", "."));
  }
  return null;
}

ΑΝ Ο ΧΡΗΣΤΗΣ ΑΝΑΦΕΡΕΙ ΓΙΑ ΤΗΝ ΚΑΤΑΧΩΡΗΣΗ ΜΙΑ ΣΥΓΚΕΚΡΙΜΕΝΗ ΠΡΟΗΓΟΥΜΕΝΗ ΗΜΕΡΟΜΗΝΙΑ Ή ΗΜΕΡΑ (π.χ. "στις 10/7", "χθες", "προχθές", "την Τρίτη", "πριν 3 μέρες"), υπολόγισε τη ΣΩΣΤΗ ημερομηνία σε μορφή YYYY-MM-DD με βάση τη ΣΗΜΕΡΙΝΗ ημερομηνία, και πρόσθεσε ΠΡΙΝ από οποιαδήποτε ACTION γραμμή, μία επιπλέον γραμμή ΑΚΡΙΒΩΣ σε αυτή τη μορφή:
[LOGDATE:YYYY-MM-DD]

ΑΝ Ο ΧΡΗΣΤΗΣ ΖΗΤΑΕΙ ΑΛΛΑΓΗ ΣΕ ΟΔΗΓΟ (όνομα, τηλέφωνο, status, ή σύμβαση ωρών), ΠΡΕΠΕΙ ΠΑΝΤΑ να συμπεριλάβεις ΣΤΟ ΤΕΛΟΣ της απάντησής σου μία γραμμή ΑΚΡΙΒΩΣ σε αυτή τη μορφή, ΧΩΡΙΣ ΝΑ ΡΩΤΑΣ ΕΠΙΒΕΒΑΙΩΣΗ ΠΡΩΤΑ:
[ACTION:{"type":"update_driver","id":<id>,"field":"<name|phone|status|contract_hours_week>","value":"<τιμή>"}]
Το πεδίο status δέχεται ΜΟΝΟ τις τιμές: "active" (ενεργός/επέστρεψε), "absent" (προσωρινή απουσία/άρρωστος/πτώση κλπ), "terminated" (απολύθηκε/παραιτήθηκε/αποχώρησε ΟΡΙΣΤΙΚΑ).
Το πεδίο contract_hours_week δέχεται αριθμό ωρών/βδομάδα (π.χ. 20 για 4ωρο πενθήμερο, 30 για 6ωρο πενθήμερο, 40 για 8ωρο πενθήμερο). Χρησιμοποίησέ το όταν ο χρήστης λέει π.χ. "ο Χ είναι τώρα 6ωρος" ή "άλλαξε τη σύμβαση του Χ σε 30 ώρες".

Παράδειγμα (απόλυση/αποχώρηση): "ο Αθανασόπουλος απολύθηκε" (id 21) → [ACTION:{"type":"update_driver","id":21,"field":"status","value":"terminated"}]
Παράδειγμα (σύμβαση): "ο Παταράκης έγινε 6ωρος" (id 4) → [ACTION:{"type":"update_driver","id":4,"field":"contract_hours_week","value":"30"}]
ΑΝ Ο ΧΡΗΣΤΗΣ ΖΗΤΑΕΙ ΜΕΤΑΦΟΡΑ/ΑΝΑΘΕΣΗ ΟΔΗΓΟΥ ΣΕ ΝΕΟ PROJECT, ΠΡΕΠΕΙ ΠΑΝΤΑ να συμπεριλάβεις ΣΤΟ ΤΕΛΟΣ μία γραμμή ΑΚΡΙΒΩΣ σε αυτή τη μορφή:
[ACTION:{"type":"assign_driver","driverId":<id_οδηγού>,"projectId":<id_project>,"shift":"<ωράριο ή κενό>","days":"<ημέρες ή κενό>","removeProjectId":<id_παλιού_project_ή_null>}]

Αν ο χρήστης αναφέρει προηγούμενη ημερομηνία γι' αυτή την καταγραφή, βάλε ΚΑΙ τη γραμμή [LOGDATE:YYYY-MM-DD] όπως παραπάνω.
ΑΝ Ο ΧΡΗΣΤΗΣ ΣΟΥ ΣΤΕΙΛΕΙ ΦΩΤΟΓΡΑΦΙΑ με πρόγραμμα/παρουσιολόγιο ωρών εργασίας, διάβασέ την προσεκτικά και εξήγαγε για κάθε γραμμή: όνομα εργαζομένου (όπως γράφεται στη φωτογραφία, ακόμα κι αν είναι δυσανάγνωστο ή συντομογραφία), ημερομηνία (YYYY-MM-DD· αν η φωτογραφία δείχνει μόνο ημέρα/μήνα χωρίς έτος, υπόθεσε το τρέχον έτος), και ώρες εργασίας (αριθμός· αν βλέπεις ώρα εισόδου-εξόδου, υπολόγισε τη διαφορά). Προσπάθησε να ταιριάξεις το όνομα με έναν από τους παραπάνω ΟΔΗΓΟΥΣ ελέγχοντας ΚΑΙ το επώνυμο ΚΑΙ το μικρό όνομα (π.χ. αν κάποιος γράφεται μόνο με το μικρό του όνομα ή παραλλαγή του), και βάλε το σωστό id αν είσαι αρκετά σίγουρος, αλλιώς άφησε "driverId":null (μην μαντεύεις αν δεν είσαι σίγουρος). Αν ο ίδιος άνθρωπος εμφανίζεται με ελαφρώς διαφορετική γραφή σε διαφορετικές γραμμές (π.χ. λόγω OCR), αντιμετώπισέ τον ως τον ΙΔΙΟ οδηγό.
ΣΗΜΑΝΤΙΚΟ: Η απάντησή σου ΠΡΕΠΕΙ να είναι ΠΟΛΥ ΣΥΝΤΟΜΗ — max 1-2 προτάσεις περίληψη (πόσες γραμμές/ονόματα διάβασες), ΧΩΡΙΣ αναλυτικούς πίνακες ή εκτενείς εξηγήσεις στο κείμενο (αυτά θα φανούν ήδη στο παράθυρο επιβεβαίωσης). Μην επαναλαμβάνεις όλα τα δεδομένα σε μορφή πίνακα μέσα στο κείμενο της απάντησης. ΑΥΤΟ ΕΙΝΑΙ ΚΡΙΣΙΜΟ: αν αναφέρεις στο κείμενο ότι διάβασες οποιεσδήποτε εγγραφές/ονόματα/ημερομηνίες από φωτογραφία, ΠΡΕΠΕΙ ΠΑΝΤΑ, ΧΩΡΙΣ ΚΑΜΙΑ ΕΞΑΙΡΕΣΗ, να συμπεριλάβεις την παρακάτω γραμμή EXTRACT με ΟΛΕΣ τις εγγραφές που ανέφερες (ίδιος αριθμός εγγραφών με αυτόν που δήλωσες στο κείμενο) — ποτέ μην αναφέρεις αριθμό εγγραφών στο κείμενο χωρίς να τις συμπεριλάβεις ΚΑΙ στην EXTRACT γραμμή. Μετά βάλε ΥΠΟΧΡΕΩΤΙΚΑ στο ΑΠΟΛΥΤΟ ΤΕΛΟΣ της απάντησης (χωρίς να ακολουθεί τίποτα άλλο μετά) μία γραμμή ΑΚΡΙΒΩΣ σε αυτή τη μορφή:

  const sendMsg = useCallback(async (txt, currentMsgs, imageAttachment=null) => {

      let customLogDate = detectBackdate(txt, new Date());
      if (!customLogDate && logDateMatch) customLogDate = logDateMatch[1];
      for (const actionMatch of actionMatches) {
        cleanText = cleanText.replace(actionMatch[0], "").trim();
        try {
          const action = JSON.parse(actionMatch[1]);
          if (action.type === "log_hours") hadLogHoursAction = true;
          if (action.type === "update_driver") {
            const isBackdatedTemporary = customLogDate && action.field === "status" && (action.value === "absent");
            if (isBackdatedTemporary) {

              }
              if (action.field === "status" && action.value === "active") {
                extraFields = { terminated_date: null, terminated_reason: null };

              setDrivers(prev => prev.map(d => d.id === action.id ? {...d, [action.field]: coercedValue, ...extraFields} : d));
              supabase.from('drivers').update({ [action.field]: coercedValue, ...extraFields }).eq('id', action.id).then(() => {});
              actionDriverId = action.id;
              if (action.field === "status") {
                const label = action.value === "terminated" ? "Αποχώρησε/Απολύθηκε" : action.value === "absent" ? "Απών" : "Ενεργός";
                notify(`Status οδηγού: ${label} ✓`, "success");
              } else if (action.field === "contract_hours_week") {
                notify(`Σύμβαση ενημερώθηκε: ${coercedValue} ώρες/βδομάδα ✓`, "success");
              } else {

              supabase.from('assignments').delete().eq('driverid', action.driverId).eq('projectid', action.removeProjectId).then(() => {});
            }
            const newAsg = { driverId:action.driverId, projectId:action.projectId, shift:action.shift||"", days:action.days||"" };
            setAssignments(prev => [...prev, newAsg]);
            supabase.from('assignments').insert({ driverid:action.driverId, projectid:action.projectId, shift:action.shift||"", days:action.days||"" }).then(() => {});
            actionDriverId = action.driverId;
            notify("Ανάθεση οδηγού καταχωρήθηκε ✓","success");
          }
          if (action.type === "log_hours") {
            const detectedHours = detectHoursFromText(txt);
            const finalHours = (detectedHours!==null && detectedHours!==undefined) ? detectedHours : (parseFloat(action.hours) || 0);
            const finalDate = customLogDate || new Date().toISOString().slice(0,10);
            const entry = { driverId:action.driverId, date:finalDate, projectId:action.projectId||null, hours:finalHours, note:action.note||txt };
            setDailyHours(prev => [entry, ...prev]);
            supabase.from('daily_hours').insert({ driverid:action.driverId, date:finalDate, projectid:action.projectId||null, hours:finalHours, note:action.note||txt }).then(() => {});
            actionDriverId = action.driverId;
            notify(`Καταγράφηκαν ${finalHours} ώρες (${finalDate}) ✓`, "success");
          }
          if (action.type === "add_partner") {
            const newPartner = { name:action.name||"—", role:action.role||"Συνεργάτης", rate:parseFloat(action.rate)||9.50, notes:action.notes||"" };
            supabase.from('partners').insert(newPartner).select().then(({data}) => {
              if (data && data[0]) setPartners(prev => [...prev, data[0]]);

            notify(`Νέος συνεργάτης: ${newPartner.name} ✓`, "success");
            addLog(`Προσθήκη νέου συνεργάτη: ${newPartner.name} (${newPartner.role})`, "partner", null, customLogDate);
          }
          if (action.type === "update_partner") {

            if (action.field === "rate") coercedValue = parseFloat(action.value) || 0;
            setPartners(prev => prev.map(p => p.id === action.id ? {...p, [action.field]: coercedValue} : p));
            supabase.from('partners').update({ [action.field]: coercedValue }).eq('id', action.id).then(() => {});
            notify("Ενημέρωση συνεργάτη καταχωρήθηκε ✓","success");
            addLog(`Ενημέρωση συνεργάτη (id:${action.id}): ${action.field} → ${coercedValue}`, "partner", null, customLogDate);
          }
        } catch(err) {}
      }
      setMessages(p=>[...p, {role:"assistant", text:cleanText}]);
      supabase.from('chat_messages').insert([
        { role:"user", text:displayText },
        { role:"assistant", text:cleanText }
      ]).then(() => {});
      const lo=txt.toLowerCase();
      if (lo.includes("απολύ")||lo.includes("απολυ")||lo.includes("παραιτ")||lo.includes("αποχώρησ")||lo.includes("αποχωρησ")) addLog(txt,"terminated",actionDriverId,customLogDate);
      else if (hadLogHoursAction) addLog(txt,"hours",actionDriverId,customLogDate);
      else if (lo.includes("απουσί")||lo.includes("απών")) addLog(txt,"absence",actionDriverId,customLogDate);
      else if (lo.includes("άδεια")||lo.includes("αδεια")) addLog(txt,"leave",actionDriverId,customLogDate);
      else if (lo.includes("αντικατάστα")) addLog(txt,"substitution",actionDriverId,customLogDate);
      else if (lo.includes("μεταφ")||lo.includes("ανάθεσ")||lo.includes("αναθεσ")) addLog(txt,"assignment",actionDriverId,customLogDate);
      else if (lo.includes("project")||lo.includes("έργο")) addLog(txt,"project",actionDriverId,customLogDate);

      if (extractData && Array.isArray(extractData.entries) && extractData.entries.length>0) {
        const enriched = extractData.entries.map(e => {
          let driverId = e.driverId || null;

          return { driverId, driverNameRaw: e.driverNameRaw||"", date: e.date||"", hours: e.hours!=null?e.hours:"", projectId };
        });

      } else if (imageAttachment) {

      }
    } catch(e) { setMessages(p=>[...p,{role:"assistant",text:"Σφάλμα σύνδεσης."}]); }
    finally { setThinking(false); }
  }, [buildPrompt, drivers]);

  const handleImageSelect = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1600;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.75);
        const base64 = compressedDataUrl.split(",")[1];
        setAttachedImage({ data: base64, mediaType: "image/jpeg", previewUrl: compressedDataUrl });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };

  const startListen = () => {

  const calcResult = () => {

  const parseLogDate = (ts) => {
    const m = (ts||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (!m) return null;
    return { day:parseInt(m[1],10), month:parseInt(m[2],10), year:parseInt(m[3],10) };
  };

  const parseRangeDays = (text) => {
    const m = (text||"").match(/(\d{1,2})\s*-\s*(\d{1,2})\/(\d{1,2})/);
    if (m) {
      const d1=parseInt(m[1],10), d2=parseInt(m[2],10);
      if (d2>=d1) return d2-d1+1;
    }
    return 1;
  };

  const computeMonthlyReport = (driverId, monthStr) => {
    const driver = drivers.find(d=>d.id===driverId);
    if (!driver) return null;
    const [yy,mm] = monthStr.split("-").map(Number);
    const daysInMonth = new Date(yy, mm, 0).getDate();
    const contractWeek = driver.contract_hours_week || 40;
    const dailyEquivalent = contractWeek / 5;
    const baselineMonthlyHours = (contractWeek/7) * daysInMonth;

    const monthLogEntries = log.filter(l => l.driverId===driverId && (() => {
      const d = parseLogDate(l.ts); return d && d.year===yy && d.month===mm;
    })());
    const monthHoursEntries = dailyHours.filter(h => h.driverId===driverId && h.date && h.date.startsWith(monthStr));

    let absenceDaysTotal = 0;
    monthLogEntries.filter(l=>l.type==="absence"||l.type==="leave").forEach(l => {
      absenceDaysTotal += parseRangeDays(l.text);
    });

    let hoursDeltaTotal = 0;
    const hourEntryDetails = monthHoursEntries.map(h => {
      const delta = (parseFloat(h.hours)||0) - dailyEquivalent;
      hoursDeltaTotal += delta;
      return { ...h, delta };
    });

    const absenceHoursLost = absenceDaysTotal * dailyEquivalent;
    const estimatedTotal = baselineMonthlyHours - absenceHoursLost + hoursDeltaTotal;
    const overtimeEstimate = hourEntryDetails.filter(h=>h.delta>0).reduce((s,h)=>s+h.delta,0);

    return {
      driver, contractWeek, dailyEquivalent, daysInMonth, baselineMonthlyHours,
      absenceDaysTotal, absenceHoursLost, hourEntryDetails, hoursDeltaTotal,
      estimatedTotal, overtimeEstimate, monthLogEntries
    };
  };

  const parseShiftHours = (shift) => {
    const m = (shift||"").match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
    if (!m) return 0;
    const h1=parseInt(m[1],10), mi1=parseInt(m[2],10), h2=parseInt(m[3],10), mi2=parseInt(m[4],10);
    let mins = (h2*60+mi2)-(h1*60+mi1);
    if (mins<0) mins += 24*60;
    return mins/60;
  };

  const parseDaysPerWeek = (daysStr) => {
    const s = (daysStr||"").toLowerCase();
    if (!s) return 5;
    if (s.includes("καθημερ")) return 7;
    if (s.includes("δευ-σαβ")) return 6;
    if (s.includes("δευ-παρ")) return 5;
    const tokens = ["δευ","τρι","τετ","πεμ","παρ","σαβ","κυρ"];
    const count = tokens.filter(tok=>s.includes(tok)).length;
    return count>0 ? count : 5;
  };

  const computeProjectMonthlyReport = (projectId, monthStr) => {
    const project = PROJECTS.find(p=>p.id===projectId);
    if (!project) return null;
    const [yy,mm] = monthStr.split("-").map(Number);
    const daysInMonth = new Date(yy, mm, 0).getDate();
    const weeksInMonth = daysInMonth/7;

    const projectAssignments = assignments.filter(a=>a.projectId===projectId);
    let baselineTotal = 0;
    const driverLines = [];
    const ambiguousNotes = [];

    projectAssignments.forEach(a => {
      const driver = drivers.find(d=>d.id===a.driverId);
      if (!driver) return;
      const shiftHours = parseShiftHours(a.shift);
      const daysPerWeek = parseDaysPerWeek(a.days);
      const baseline = shiftHours * daysPerWeek * weeksInMonth;

      const driverProjectCount = assignments.filter(x=>x.driverId===a.driverId).length;
      let absenceHours = 0;
      if (driverProjectCount === 1) {
        const driverAbsences = log.filter(l => l.driverId===a.driverId && (l.type==="absence"||l.type==="leave") && (() => {
          const d = parseLogDate(l.ts); return d && d.year===yy && d.month===mm;
        })());
        let absenceDays = 0;
        driverAbsences.forEach(l => { absenceDays += parseRangeDays(l.text); });
        absenceHours = absenceDays * shiftHours;
      } else if (driverProjectCount > 1) {
        const hasAbsence = log.some(l => l.driverId===a.driverId && (l.type==="absence"||l.type==="leave") && (() => {
          const d = parseLogDate(l.ts); return d && d.year===yy && d.month===mm;
        })());
        if (hasAbsence) ambiguousNotes.push(`${driver.name} έχει καταγεγραμμένη απουσία αλλά δουλεύει σε ${driverProjectCount} projects — έλεγξε χειροκίνητα ποιο project επηρεάζεται.`);
      }

      let delta = 0;
      projectHoursEntries.forEach(h => { delta += (parseFloat(h.hours)||0) - shiftHours; });

      const finalHours = baseline - absenceHours + delta;
      baselineTotal += finalHours;
      driverLines.push({ driver, shiftHours, daysPerWeek, baseline, absenceHours, delta, finalHours });
    });

    const cost = baselineTotal * (project.rateDay||0);

    return { project, daysInMonth, driverLines, totalHours:baselineTotal, cost, ambiguousNotes };

      </div>

      <div style={S.bottomNav}>
        {TABS.map(t=>(
          <button key={t.id} style={{...S.navBtn,color:tab===t.id?"#00e5a0":"#556"}} onClick={()=>{setTab(t.id);setSearch("");setCatFilter("all");setDriversView("active");}}>
            <span style={{fontSize:22}}>{t.emoji}</span>
            <span style={{fontSize:9,marginTop:2,fontWeight:tab===t.id?700:400}}>{t.label}</span>
          </button>
        ))}
      </div>

      {calcOpen && (
        <div style={S.overlay}>
          <div style={S.modal}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 16px 12px",borderBottom:"1px solid #1e2a4a"}}>
              <span style={{fontWeight:800,fontSize:16,color:"#f5c518"}}>💰 Κοστολόγηση</span>
              <button style={{background:"none",border:"none",color:"#556",cursor:"pointer",fontSize:20}} onClick={()=>setCalcOpen(false)}>✕</button>
            </div>
            <div style={{padding:16,overflowY:"auto"}}>
              {[["Τύπος",[["employee","Υπάλληλος"],["partner","Εργολάβος"]],calcDT,setCalcDT,"#f5c518"],
                ["Μηχανάκι",[["company","Εταιρικό"],["own","Ιδιόκτητο"]],calcMoto,setCalcMoto,"#5b8cff"]
              ].map(([lbl,opts,val,setter,clr])=>(
                <div key={lbl}>
                  <div style={{fontSize:11,fontWeight:700,color:"#445",letterSpacing:2,textTransform:"uppercase",marginBottom:8,marginTop:14}}>{lbl}</div>
                  <div style={{display:"flex",gap:8}}>
                    {opts.map(([v,l])=>(
                      <button key={v} style={{borderRadius:20,padding:"8px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",border:"none",background:val===v?clr:"#1a2540",color:val===v?"#0a0f1e":"#778"}} onClick={()=>setter(v)}>{l}</button>
                    ))}
                  </div>
                </div>
              ))}
              {calcDT==="employee" && (
                <div>
                  <div style={{fontSize:11,fontWeight:700,color:"#445",letterSpacing:2,textTransform:"uppercase",marginBottom:8,marginTop:14}}>Τύπος Ώρας</div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    {[["normal","Κανονική"],["overtime","Υπερωρία"],["night","Νυχτερινή"],["sunday","Κυρ/Αργία"]].map(([v,l])=>(
                      <button key={v} style={{borderRadius:20,padding:"8px 12px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",border:"none",background:calcType===v?"#00e5a0":"#1a2540",color:calcType===v?"#0a0f1e":"#778"}} onClick={()=>setCalcType(v)}>{l}</button>
                    ))}
                  </div>
                </div>
              )}
              <div style={{fontSize:11,fontWeight:700,color:"#445",letterSpacing:2,textTransform:"uppercase",marginBottom:8,marginTop:14}}>Ώρες Εργασίας</div>
              <input style={{background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:10,padding:"12px 16px",fontSize:20,fontWeight:700,width:"100%",color:"#e8eaf6",outline:"none",fontFamily:"inherit"}} type="number" placeholder="π.χ. 8" value={calcH} onChange={e=>setCalcH(e.target.value)}/>
              {calcResult() && (
                <div style={{background:"#0a0f1e",border:"1px solid #00e5a0",borderRadius:12,padding:20,textAlign:"center",marginTop:20}}>
                  <div style={{fontSize:13,color:"#778",marginBottom:4}}>{calcResult().h} ώρες × €{calcResult().rate}/ώρα</div>
                  <div style={{fontSize:36,fontWeight:900,color:"#00e5a0"}}>€{calcResult().total}</div>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {reportOpen && (
        <div style={S.overlay}>
          <div style={S.modal}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 16px 12px",borderBottom:"1px solid #1e2a4a"}}>
              <span style={{fontWeight:800,fontSize:16,color:"#f5c518"}}>📊 Μηνιαία Αναφορά</span>
              <button style={{background:"none",border:"none",color:"#556",cursor:"pointer",fontSize:20}} onClick={()=>setReportOpen(false)}>✕</button>
            </div>
            <div style={{padding:16,overflowY:"auto"}}>
              <div style={{fontSize:11,fontWeight:700,color:"#445",letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>Οδηγός</div>
              <select style={{width:"100%",background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:10,padding:"10px 12px",color:"#e8eaf6",fontSize:14,fontFamily:"inherit",marginBottom:14}} value={reportDriverId||""} onChange={e=>setReportDriverId(parseInt(e.target.value,10))}>
                {drivers.filter(d=>d.status!=="terminated").map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
              <div style={{fontSize:11,fontWeight:700,color:"#445",letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>Μήνας</div>
              <input type="month" style={{width:"100%",background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:10,padding:"10px 12px",color:"#e8eaf6",fontSize:14,fontFamily:"inherit",marginBottom:14}} value={reportMonth} onChange={e=>setReportMonth(e.target.value)}/>

              {reportDriverId && (() => {
                const r = computeMonthlyReport(reportDriverId, reportMonth);
                if (!r) return null;
                return (
                  <div>
                    <div style={{background:"#0a0f1e",border:"1px solid #a78bfa",borderRadius:12,padding:16,marginBottom:14}}>
                      <div style={{fontSize:13,color:"#778",marginBottom:6}}>Σύμβαση: {r.contractWeek} ώρες/βδομάδα ({r.dailyEquivalent.toFixed(1)} ώρες/ημέρα)</div>
                      <div style={{fontSize:13,color:"#778",marginBottom:6}}>Βασικές ώρες μήνα ({r.daysInMonth} ημέρες): <b style={{color:"#e8eaf6"}}>{r.baselineMonthlyHours.toFixed(1)}</b></div>
                      {r.absenceDaysTotal>0 && <div style={{fontSize:13,color:"#ff6b6b",marginBottom:6}}>− Απουσίες/Άδειες: {r.absenceDaysTotal} ημέρες (−{r.absenceHoursLost.toFixed(1)} ώρες)</div>}
                      {r.hoursDeltaTotal!==0 && <div style={{fontSize:13,color:r.hoursDeltaTotal>0?"#00e5a0":"#f5c518",marginBottom:6}}>{r.hoursDeltaTotal>0?"+":""}{r.hoursDeltaTotal.toFixed(1)} ώρες από καταγεγραμμένες αποκλίσεις</div>}
                      <div style={{borderTop:"1px solid #1e2a4a",marginTop:10,paddingTop:10}}>
                        <div style={{fontSize:13,color:"#778"}}>Εκτιμώμενο σύνολο ωρών μήνα</div>
                        <div style={{fontSize:28,fontWeight:900,color:"#00e5a0"}}>{r.estimatedTotal.toFixed(1)} ώρες</div>
                        {r.overtimeEstimate>0 && <div style={{fontSize:12,color:"#f5c518",marginTop:4}}>Εκ των οποίων ~{r.overtimeEstimate.toFixed(1)} ώρες υπερωρία (από καταγεγραμμένες μέρες)</div>}
                      </div>
                    </div>
                    <div style={{fontSize:11,fontWeight:700,color:"#445",letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>Καταγραφές μήνα ({r.monthLogEntries.length})</div>
                    {r.monthLogEntries.length===0 && <div style={{fontSize:12,color:"#445",marginBottom:10}}>Καμία καταγραφή αυτό το μήνα.</div>}
                    {r.monthLogEntries.map(l=>(
                      <div key={l.id} style={{...S.card,padding:10,marginBottom:6}}>
                        <div style={{fontSize:12,color:"#b0b8d0"}}>{l.text}</div>
                        <div style={{fontSize:10,color:"#445",marginTop:2}}>{l.ts}</div>
                      </div>
                    ))}
                    <div style={{fontSize:10,color:"#556",marginTop:10,lineHeight:1.5}}>
                      ⚠️ Εκτιμώμενος υπολογισμός βάσει σύμβασης + καταγεγραμμένων εξαιρέσεων. Δεν αντικαθιστά ακριβή καταγραφή παρουσίας — να επαληθεύεται πριν την πληρωμή.
                    </div>
                  </div>
                );
              })()}
            </div>
          </div>
        </div>
      )}

      {invoiceOpen && (
        <div style={S.overlay}>
          <div style={S.modal}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 16px 12px",borderBottom:"1px solid #1e2a4a"}}>
              <span style={{fontWeight:800,fontSize:16,color:"#f5c518"}}>🧾 Μηνιαία Τιμολόγηση</span>
              <button style={{background:"none",border:"none",color:"#556",cursor:"pointer",fontSize:20}} onClick={()=>setInvoiceOpen(false)}>✕</button>
            </div>
            <div style={{padding:16,overflowY:"auto"}}>
              <div style={{fontSize:11,fontWeight:700,color:"#445",letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>Project</div>
              <select style={{width:"100%",background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:10,padding:"10px 12px",color:"#e8eaf6",fontSize:14,fontFamily:"inherit",marginBottom:14}} value={invoiceProjectId||""} onChange={e=>setInvoiceProjectId(parseInt(e.target.value,10))}>
                {PROJECTS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
              <div style={{fontSize:11,fontWeight:700,color:"#445",letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>Μήνας</div>
              <input type="month" style={{width:"100%",background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:10,padding:"10px 12px",color:"#e8eaf6",fontSize:14,fontFamily:"inherit",marginBottom:14}} value={invoiceMonth} onChange={e=>setInvoiceMonth(e.target.value)}/>

              {invoiceProjectId && (() => {
                const r = computeProjectMonthlyReport(invoiceProjectId, invoiceMonth);
                if (!r) return null;
                return (
                  <div>
                    <div style={{background:"#0a0f1e",border:"1px solid #00e5a0",borderRadius:12,padding:16,marginBottom:14,textAlign:"center"}}>
                      <div style={{fontSize:13,color:"#778",marginBottom:4}}>{r.totalHours.toFixed(1)} ώρες × {fmtEur(r.project.rateDay)}/ώρα</div>
                      <div style={{fontSize:32,fontWeight:900,color:"#00e5a0"}}>{fmtEur(r.cost)}</div>
                    </div>
                    <div style={{fontSize:11,fontWeight:700,color:"#445",letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>Ανάλυση ανά οδηγό</div>
                    {r.driverLines.length===0 && <div style={{fontSize:12,color:"#445",marginBottom:10}}>Κανένας οδηγός ανατεθειμένος σε αυτό το project.</div>}
                    {r.driverLines.map((dl,i)=>(
                      <div key={i} style={{...S.card,padding:10,marginBottom:6}}>
                        <div style={{fontSize:13,fontWeight:700,marginBottom:2}}>{dl.driver.name}</div>
                        <div style={{fontSize:11,color:"#778"}}>{dl.shiftHours.toFixed(1)} ώρες/ημέρα × {dl.daysPerWeek} ημέρες/βδομάδα → {dl.baseline.toFixed(1)} βασικές ώρες</div>
                        {dl.absenceHours>0 && <div style={{fontSize:11,color:"#ff6b6b"}}>− {dl.absenceHours.toFixed(1)} ώρες απουσίας</div>}
                        {dl.delta!==0 && <div style={{fontSize:11,color:dl.delta>0?"#00e5a0":"#f5c518"}}>{dl.delta>0?"+":""}{dl.delta.toFixed(1)} ώρες απόκλισης</div>}
                        <div style={{fontSize:12,fontWeight:700,color:"#e8eaf6",marginTop:4}}>Σύνολο: {dl.finalHours.toFixed(1)} ώρες</div>
                      </div>
                    ))}
                    {r.ambiguousNotes.length>0 && (
                      <div style={{background:"#f5c51811",border:"1px solid #f5c518",borderRadius:10,padding:10,marginTop:10}}>
                        {r.ambiguousNotes.map((n,i)=><div key={i} style={{fontSize:11,color:"#f5c518",marginBottom:4}}>⚠️ {n}</div>)}
                      </div>
                    )}
                    <div style={{fontSize:10,color:"#556",marginTop:10,lineHeight:1.5}}>
                      ⚠️ Εκτιμώμενος υπολογισμός βάσει προγραμματισμένου ωραρίου + καταγεγραμμένων εξαιρέσεων. Δεν διαχωρίζει αυτόματα νυχτερινές/Κυριακή ώρες — να επαληθεύεται πριν την τιμολόγηση.
                    </div>
                  </div>
                );
              })()}
            </div>
          </div>
        </div>
      )}

      {chatOpen && (
        <div style={S.chatPanel}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px 12px",borderBottom:"1px solid #1e2a4a"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,fontSize:15,fontWeight:700}}>
              <span style={{background:"linear-gradient(135deg,#00e5a0,#5b8cff)",color:"#0a0f1e",fontSize:10,fontWeight:900,padding:"2px 7px",borderRadius:6}}>AI</span>
              ALLYRA Γραμματέας
            </div>
            <button style={{background:"none",border:"none",color:"#556",cursor:"pointer",fontSize:20}} onClick={()=>setChatOpen(false)}>✕</button>
          </div>
          <div style={S.msgs}>
            {messages.map((m,i)=>(
              <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
                <div style={{...S.bubble,background:m.role==="user"?"#00e5a0":"#1a2540",color:m.role==="user"?"#0a0f1e":"#e8eaf6",borderRadius:m.role==="user"?"18px 18px 4px 18px":"18px 18px 18px 4px"}}>
                  {renderChatText(m.text)}
                </div>
              </div>
            ))}
            {thinking && <div style={{display:"flex"}}><div style={{...S.bubble,background:"#1a2540",color:"#556"}}>Σκέφτομαι...</div></div>}
            <div ref={msgEnd}/>
          </div>
          {attachedImage && (
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderTop:"1px solid #1e2a4a"}}>
              <img src={attachedImage.previewUrl} style={{width:44,height:44,objectFit:"cover",borderRadius:8,border:"1px solid #2a3560"}}/>
              <div style={{fontSize:12,color:"#778",flex:1}}>Φωτογραφία έτοιμη για αποστολή</div>
              <button style={{background:"none",border:"none",color:"#ff6b6b",fontSize:16,cursor:"pointer"}} onClick={()=>setAttachedImage(null)}>✕</button>
            </div>
          )}
          <input type="file" accept="image/*" ref={fileInputRef} style={{display:"none"}} onChange={e=>handleImageSelect(e.target.files[0])}/>
          <div style={S.inputRow}>
            <button style={{width:42,height:42,borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#e8eaf6",flexShrink:0,background:"#1a2540",border:"1px solid #2a3560",fontSize:18}} onClick={()=>fileInputRef.current?.click()}>
              📷
            </button>
            <textarea
              ref={textAreaRef}
              style={S.textInput}
              value={input}
              rows={1}
              onChange={e=>{
                setInput(e.target.value);
                e.target.style.height="auto";
                e.target.style.height=Math.min(e.target.scrollHeight,110)+"px";
              }}
              placeholder="Γράψε εντολή στα ελληνικά..."
            />
            <button style={{width:42,height:42,borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#e8eaf6",flexShrink:0,background:listening?"#ff6b6b":"#1a2540",border:`1px solid ${listening?"#ff6b6b":"#2a3560"}`,fontSize:18}} onClick={listening?()=>{recRef.current?.stop();setListening(false);}:startListen}>
              {listening?"🔴":"🎙"}
            </button>
            <button style={{width:42,height:42,borderRadius:"50%",background:"#00e5a0",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#0a0f1e",flexShrink:0,fontSize:18}} onClick={()=>sendMsg(input,messages,attachedImage)}>➤</button>
          </div>
          {listening && <div style={{textAlign:"center",fontSize:12,color:"#ff6b6b",padding:"6px",background:"#ff6b6b11",fontWeight:600}}>🎙 Ακούω... μίλα στα ελληνικά</div>}
        </div>
      )}

      {extractOpen && (
        <div style={S.overlay}>
          <div style={S.modal}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 16px 12px",borderBottom:"1px solid #1e2a4a"}}>
              <span style={{fontWeight:800,fontSize:16,color:"#f5c518"}}>📷 Επιβεβαίωση από Φωτογραφία</span>
              <button style={{background:"none",border:"none",color:"#556",cursor:"pointer",fontSize:20}} onClick={()=>{setExtractOpen(false);setExtractEntries([]);}}>✕</button>
            </div>
            <div style={{padding:16,overflowY:"auto"}}>
              <div style={{fontSize:12,color:"#778",marginBottom:12,lineHeight:1.5}}>Έλεγξε/διόρθωσε πριν καταχωρήσεις. Γραμμές χωρίς επιλεγμένο οδηγό, ημερομηνία ή ώρες δεν θα καταχωρηθούν.</div>
              {extractEntries.length===0 && <div style={{fontSize:13,color:"#445"}}>Καμία εγγραφή.</div>}
              {(() => {
                const groups = {};
                const order = [];
                extractEntries.forEach((e, idx) => {
                  const key = e.driverId ? `d-${e.driverId}` : `n-${e.driverNameRaw}`;
                  if (!groups[key]) { groups[key] = { driverId:e.driverId, driverNameRaw:e.driverNameRaw, projectId:e.projectId||null, idxs:[] }; order.push(key); }
                  groups[key].idxs.push(idx);
                });
                return order.map(key => {
                  const g = groups[key];
                  const items = g.idxs.map(idx => ({ idx, ...extractEntries[idx] }));
                  const totalHours = items.reduce((s,it)=>s+(parseFloat(it.hours)||0),0);
                  const proj = g.projectId ? PROJECTS.find(p=>p.id===g.projectId) : null;
                  const cost = proj ? totalHours * (proj.rateDay||0) : null;
                  return (
                    <div key={key} style={{...S.card,marginBottom:12}}>
                      <div style={{fontSize:11,color:"#778",marginBottom:6}}>Στη φωτογραφία: "{g.driverNameRaw}"</div>
                      <select style={{width:"100%",background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:8,padding:"8px 10px",color:"#e8eaf6",fontSize:13,fontFamily:"inherit",marginBottom:6}} value={g.driverId||""} onChange={ev=>updateGroupDriver(g.idxs, parseInt(ev.target.value,10)||null)}>
                        <option value="">— Επίλεξε οδηγό —</option>
                        {drivers.filter(d=>d.status!=="terminated").map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
                      </select>
                      <select style={{width:"100%",background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:8,padding:"8px 10px",color:"#e8eaf6",fontSize:13,fontFamily:"inherit",marginBottom:8}} value={g.projectId||""} onChange={ev=>updateGroupProject(g.idxs, parseInt(ev.target.value,10)||null)}>
                        <option value="">— Χωρίς σύνδεση με project —</option>
                        {PROJECTS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                      {items.map(it => (
                        <div key={it.idx} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
                          <input type="date" style={{flex:1,background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:8,padding:"7px 8px",color:"#e8eaf6",fontSize:12,fontFamily:"inherit"}} value={it.date} onChange={ev=>updateExtractEntry(it.idx,"date",ev.target.value)}/>
                          <input type="number" step="0.1" placeholder="ώρες" style={{width:70,background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:8,padding:"7px 8px",color:"#e8eaf6",fontSize:12,fontFamily:"inherit"}} value={it.hours} onChange={ev=>updateExtractEntry(it.idx,"hours",ev.target.value)}/>
                          <button style={{background:"none",border:"none",color:"#ff6b6b",fontSize:14,cursor:"pointer",flexShrink:0}} onClick={()=>removeExtractEntry(it.idx)}>✕</button>
                        </div>
                      ))}
                      <button style={{background:"none",border:"none",color:"#5b8cff",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",padding:0,marginBottom:8}} onClick={()=>addRowToGroup(g.driverId, g.driverNameRaw, g.projectId)}>
                        + Προσθήκη ημέρας
                      </button>
                      <div style={{borderTop:"1px solid #1e2a4a",paddingTop:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <div style={{fontSize:13,fontWeight:700,color:"#e8eaf6"}}>Σύνολο: {totalHours.toFixed(2)} ώρες</div>
                        {cost!==null && <div style={{fontSize:13,fontWeight:700,color:"#00e5a0"}}>≈ {fmtEur(cost)}</div>}
                      </div>
                    </div>
                  );
                });
              })()}
              <button style={{width:"100%",background:"#00e5a0",border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:800,color:"#0a0f1e",cursor:"pointer",fontFamily:"inherit",marginTop:8}} onClick={confirmExtractEntries}>
                ✅ Καταχώρηση όλων
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
