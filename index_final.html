async function callAllyra(sys, history, newMsg) {
  const API_KEY = "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";
  const messages = [
    ...history.slice(-10).map(m => ({ role: m.role==="user"?"user":"assistant", content: m.text })),
    { role:"user", content:newMsg }
  ];
  const res = await fetch("/api/chat", {

                      {p.address && <div style={{fontSize:11,color:"#556"}}>{p.address}</div>}
                    </div>
                    <div style={{...S.badge,background:p.status==="stopped"?"#88822":cat.color+"22",color:p.status==="stopped"?"#888":cat.color,border:`1px solid ${p.status==="stopped"?"#888":cat.color}`}}>
                      {p.status==="stopped"?"Σταμάτησε":cat.label}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
                    <span style={{fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20,background:"#00e5a022",color:"#00e5a0",border:"1px solid #00e5a0"}}>Ημέρα {fmtEur(p.rateDay)}/ώρα</span>
                    {p.rateNight && <span style={{fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20,background:"#5b8cff22",color:"#5b8cff",border:"1px solid #5b8cff"}}>Βράδυ {fmtEur(p.rateNight)}</span>}
                    {p.rateSun && <span style={{fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20,background:"#f5c51822",color:"#f5c518",border:"1px solid #f5c518"}}>Κυρ {fmtEur(p.rateSun)}</span>}
                  </div>
                  {pD.map((d,i)=><div key={i} style={S.cardSub}>👤 {d.name} · {d.shift} · {d.days}</div>)}
                </div>
              );
            })}
          </div>
        )}

        {tab==="partners" && (
          <div style={S.view}>
            <div style={{fontSize:20,fontWeight:800,marginBottom:16}}>Συνεργάτες <span style={{fontSize:12,fontWeight:700,background:"#1e2a4a",color:"#778",padding:"2px 8px",borderRadius:20}}>{PARTNERS.length}</span></div>
            <div style={{fontSize:11,fontWeight:700,letterSpacing:2,color:"#445",textTransform:"uppercase",marginBottom:8}}>Ομάδα Μητούδη</div>
            {PARTNERS.filter(p=>p.role.includes("Μητούδη")||p.name==="Μητούδης Δημήτρης").map(p=>(
              <div key={p.id} style={S.card}>
                <div style={{display:"flex",gap:12}}>
                  <div style={{width:42,height:42,borderRadius:"50%",background:"#1a2540",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:900,color:"#f5c518",flexShrink:0}}>Μ</div>
                  <div>
                    <div style={S.cardName}>{p.name}</div>
                    <div style={S.cardSub}>{p.role} · €{p.rate}/ώρα</div>
                    {p.notes && <div style={S.cardSub}>{p.notes}</div>}
                  </div>
                </div>
              </div>
            ))}
            <div style={{fontSize:11,fontWeight:700,letterSpacing:2,color:"#445",textTransform:"uppercase",marginBottom:8,marginTop:12}}>Λοιποί Συνεργάτες</div>
            {PARTNERS.filter(p=>!p.role.includes("Μητούδη")&&p.name!=="Μητούδης Δημήτρης").map(p=>(
              <div key={p.id} style={S.card}>
                <div style={{display:"flex",gap:12}}>
                  <div style={{width:42,height:42,borderRadius:"50%",background:"#1a2540",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"#a78bfa",flexShrink:0}}>Ε</div>
                  <div>
                    <div style={S.cardName}>{p.name}</div>
                    <div style={S.cardSub}>{p.role} · €{p.rate}/ώρα</div>
                    {p.notes && <div style={S.cardSub}>{p.notes}</div>}
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}

        {tab==="log" && (
          <div style={S.view}>
            <div style={{fontSize:20,fontWeight:800,marginBottom:16}}>Αρχείο Μεταβολών</div>
            {log.map(l=>{
              const c=l.type==="absence"?"#ff6b6b":l.type==="substitution"?"#f5c518":"#5b8cff";
              return (
                <div key={l.id} style={S.card}>
                  <div style={{display:"flex",gap:10}}>
                    <div style={{width:10,height:10,borderRadius:"50%",flexShrink:0,marginTop:4,background:c}}/>
                    <div>
                      <div style={{...S.badge,display:"inline-block",marginBottom:4,background:c+"22",color:c,border:`1px solid ${c}`}}>
                        {l.type==="absence"?"Απουσία":l.type==="substitution"?"Αντικατάσταση":"Σύστημα"}
                      </div>
                      <div style={{fontSize:13,color:"#b0b8d0",lineHeight:1.4}}>{l.text}</div>
                      <div style={{fontSize:11,color:"#445",marginTop:3}}>{l.ts}</div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div style={S.bottomNav}>
        {TABS.map(t=>(
          <button key={t.id} style={{...S.navBtn,color:tab===t.id?"#00e5a0":"#556"}} onClick={()=>{setTab(t.id);setSearch("");setCatFilter("all");}}>
            <span style={{fontSize:22}}>{t.emoji}</span>
            <span style={{fontSize:9,marginTop:2,fontWeight:tab===t.id?700:400}}>{t.label}</span>
          </button>
        ))}
      </div>

      {calcOpen && (
        <div style={S.overlay}>
          <div style={S.modal}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 16px 12px",borderBottom:"1px solid #1e2a4a"}}>
              <span style={{fontWeight:800,fontSize:16,color:"#f5c518"}}>💰 Κοστολόγηση</span>
              <button style={{background:"none",border:"none",color:"#556",cursor:"pointer",fontSize:20}} onClick={()=>setCalcOpen(false)}>✕</button>
            </div>
            <div style={{padding:16,overflowY:"auto"}}>
              {[["Τύπος",[["employee","Υπάλληλος"],["partner","Εργολάβος"]],calcDT,setCalcDT,"#f5c518"],
                ["Μηχανάκι",[["company","Εταιρικό"],["own","Ιδιόκτητο"]],calcMoto,setCalcMoto,"#5b8cff"]
              ].map(([lbl,opts,val,setter,clr])=>(
                <div key={lbl}>
                  <div style={{fontSize:11,fontWeight:700,color:"#445",letterSpacing:2,textTransform:"uppercase",marginBottom:8,marginTop:14}}>{lbl}</div>
                  <div style={{display:"flex",gap:8}}>
                    {opts.map(([v,l])=>(
                      <button key={v} style={{borderRadius:20,padding:"8px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",border:"none",background:val===v?clr:"#1a2540",color:val===v?"#0a0f1e":"#778"}} onClick={()=>setter(v)}>{l}</button>
                    ))}
                  </div>
                </div>
              ))}
              {calcDT==="employee" && (
                <div>
                  <div style={{fontSize:11,fontWeight:700,color:"#445",letterSpacing:2,textTransform:"uppercase",marginBottom:8,marginTop:14}}>Τύπος Ώρας</div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    {[["normal","Κανονική"],["overtime","Υπερωρία"],["night","Νυχτερινή"],["sunday","Κυρ/Αργία"]].map(([v,l])=>(
                      <button key={v} style={{borderRadius:20,padding:"8px 12px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",border:"none",background:calcType===v?"#00e5a0":"#1a2540",color:calcType===v?"#0a0f1e":"#778"}} onClick={()=>setCalcType(v)}>{l}</button>
                    ))}
                  </div>
                </div>
              )}
              <div style={{fontSize:11,fontWeight:700,color:"#445",letterSpacing:2,textTransform:"uppercase",marginBottom:8,marginTop:14}}>Ώρες Εργασίας</div>
              <input style={{background:"#0a0f1e",border:"1px solid #2a3560",borderRadius:10,padding:"12px 16px",fontSize:20,fontWeight:700,width:"100%",color:"#e8eaf6",outline:"none",fontFamily:"inherit"}} type="number" placeholder="π.χ. 8" value={calcH} onChange={e=>setCalcH(e.target.value)}/>
              {calcResult() && (
                <div style={{background:"#0a0f1e",border:"1px solid #00e5a0",borderRadius:12,padding:20,textAlign:"center",marginTop:20}}>
                  <div style={{fontSize:13,color:"#778",marginBottom:4}}>{calcResult().h} ώρες × €{calcResult().rate}/ώρα</div>
                  <div style={{fontSize:36,fontWeight:900,color:"#00e5a0"}}>€{calcResult().total}</div>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {chatOpen && (
        <div style={S.chatPanel}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px 12px",borderBottom:"1px solid #1e2a4a"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,fontSize:15,fontWeight:700}}>
              <span style={{background:"linear-gradient(135deg,#00e5a0,#5b8cff)",color:"#0a0f1e",fontSize:10,fontWeight:900,padding:"2px 7px",borderRadius:6}}>AI</span>
              ALLYRA Γραμματέας
            </div>
            <button style={{background:"none",border:"none",color:"#556",cursor:"pointer",fontSize:20}} onClick={()=>setChatOpen(false)}>✕</button>
          </div>
          <div style={S.msgs}>
            {messages.map((m,i)=>(
              <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
                <div style={{...S.bubble,background:m.role==="user"?"#00e5a0":"#1a2540",color:m.role==="user"?"#0a0f1e":"#e8eaf6",borderRadius:m.role==="user"?"18px 18px 4px 18px":"18px 18px 18px 4px"}}>
                  {m.text}
                </div>
              </div>
            ))}
            {thinking && <div style={{display:"flex"}}><div style={{...S.bubble,background:"#1a2540",color:"#556"}}>Σκέφτομαι...</div></div>}
            <div ref={msgEnd}/>
          </div>
          <div style={S.inputRow}>
            <input style={S.textInput} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendMsg(input,messages)} placeholder="Γράψε εντολή στα ελληνικά..."/>
            <button style={{width:42,height:42,borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#e8eaf6",flexShrink:0,background:listening?"#ff6b6b":"#1a2540",border:`1px solid ${listening?"#ff6b6b":"#2a3560"}`,fontSize:18}} onClick={listening?()=>{recRef.current?.stop();setListening(false);}:startListen}>
              {listening?"🔴":"🎙"}
            </button>
            <button style={{width:42,height:42,borderRadius:"50%",background:"#00e5a0",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#0a0f1e",flexShrink:0,fontSize:18}} onClick={()=>sendMsg(input,messages)}>➤</button>
          </div>
          {listening && <div style={{textAlign:"center",fontSize:12,color:"#ff6b6b",padding:"6px",background:"#ff6b6b11",fontWeight:600}}>🎙 Ακούω... μίλα στα ελληνικά</div>}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
